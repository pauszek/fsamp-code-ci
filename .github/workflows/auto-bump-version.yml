name: Auto bump version via PR after Build
on:
  workflow_run:
    workflows: [ "Build" ]
    branches: [ main ]
    types: [ completed ]

concurrency:
  group: auto-bump-pr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  pr-bump:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}

      - name: Checkout triggering commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump release.version (patch with rollover)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          file="release.version"
          [[ -f "$file" ]] || { echo "Error: '$file' not found."; exit 1; }
          current="$(tr -d ' \r\n' < "$file")"
          [[ -n "$current" ]] || { echo "Error: '$file' is empty."; exit 1; }
          base="${current%%-*}"
          suffix="${current#"$base"}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Error: Version '$base' must be major.minor.patch"; exit 1; }
          IFS='.' read -r major minor patch <<< "$base"
          patch=$((patch + 1))
          if (( patch >= 100 )); then patch=0; minor=$((minor + 1)); fi
          if (( minor >= 100 )); then minor=0; major=$((major + 1)); fi
          new=$(printf "%d.%d.%d%s" "$major" "$minor" "$patch" "$suffix")
          echo "$new" > "$file"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "[skip ci] chore: bump release.version to ${{ steps.bump.outputs.new }}"
          title: "[skip ci] chore: bump release.version to ${{ steps.bump.outputs.new }}"
          body: "Automated bump from Build run ${{ github.event.workflow_run.id }}."
          branch: chore/autobump-${{ steps.bump.outputs.new }}
          base: main
          labels: autobump
          delete-branch: true

      - name: Enable auto-merge (squash)
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
