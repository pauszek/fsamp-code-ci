name: Auto bump version after Build
on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]

concurrency:
  group: auto-bump-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  bump:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout head of triggering run
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Bump release.version (patch with rollover)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          file="release.version"
          [[ -f "$file" ]] || { echo "Error: '$file' not found."; exit 1; }
          current="$(tr -d ' \r\n' < "$file")"
          [[ -n "$current" ]] || { echo "Error: '$file' is empty."; exit 1; }
          base="${current%%-*}"
          suffix="${current#"$base"}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Error: Version '$base' must be major.minor.patch"; exit 1; }
          IFS='.' read -r major minor patch <<< "$base"
          patch=$((patch + 1))
          if (( patch >= 100 )); then patch=0; minor=$((minor + 1)); fi
          if (( minor >= 100 )); then minor=0; major=$((major + 1)); fi
          new=$(printf "%d.%d.%d%s" "$major" "$minor" "$patch" "$suffix")
          echo "$new" > "$file"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and push release.version
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add release.version
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] chore: bump release.version to ${NEW_VERSION}"
            git pull --rebase origin "${BRANCH}"
            git push origin HEAD:${BRANCH}
          fi