name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          gh pr review --approve ${{ fromJSON(steps.release.outputs.pr).number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          gh pr merge --squash --auto ${{ fromJSON(steps.release.outputs.pr).number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
