name: Build for Python Project

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: false
      GABRBA_SECRET:
        description: GitHub App private key for cross-repo access
        required: false
      LOCALSTACK_AUTH_TOKEN:
        description: LocalStack Pro token for E2E tests
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token. When omitted, coverage remains available as a short-lived workflow artifact.
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load Configuration
    runs-on: ubuntu-latest
    outputs:
      ci_python_version: ${{ steps.out.outputs.ci_python_version }}
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      docker_enabled: ${{ steps.out.outputs.docker_enabled }}
      docker_image_name: ${{ steps.out.outputs.docker_image_name }}
      docker_registry: ${{ steps.out.outputs.docker_registry }}
      docker_dockerfile: ${{ steps.out.outputs.docker_dockerfile }}
      docker_platforms: ${{ steps.out.outputs.docker_platforms }}
      docker_runner: ${{ steps.out.outputs.docker_runner }}
      sonar_enabled: ${{ steps.out.outputs.sonar_enabled }}
      sonar_organization: ${{ steps.out.outputs.sonar_organization }}
      sonar_project_key: ${{ steps.out.outputs.sonar_project_key }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --quiet --disable-pip-version-check pyyaml

      - name: Parse .github/params.yml
        id: out
        run: |
          python3 - <<'PY'
          import os, yaml
          
          data = {}
          try:
              with open(".github/params.yml") as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              pass
          
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          docker = data.get("docker", {}) or {}
          sonar = data.get("sonar", {}) or {}
          
          def w(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"{k}={v}\n")
          
          w("ci_python_version", ci.get("python-version", "3.11"))
          w("files_version", files.get("version", "release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch", "main"))
          w("bump_label", bump.get("label", "autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("docker_enabled", str(docker.get("enabled", False)).lower())
          w("docker_image_name", docker.get("image-name", ""))
          w("docker_registry", docker.get("registry", "ghcr.io"))
          w("docker_dockerfile", docker.get("dockerfile", "Dockerfile"))
          w("docker_platforms", docker.get("platforms", "linux/arm64"))
          w("docker_runner", docker.get("runner", "ubuntu-24.04-arm"))
          w("sonar_enabled", str(sonar.get("enabled", False)).lower())
          w("sonar_organization", sonar.get("organization", ""))
          w("sonar_project_key", sonar.get("project-key", ""))
          PY

      - name: Read version
        id: ver
        run: |
          file="${{ steps.out.outputs.files_version }}"
          [[ -s "$file" ]] && echo "version=$(tr -d ' \r\n' < "$file")" >> "$GITHUB_OUTPUT" || echo "version=0.0.0" >> "$GITHUB_OUTPUT"
  build:
    name: Build and Test
    needs: params
    runs-on: ${{ needs.params.outputs.docker_runner }}
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for schema.version
        id: schema
        run: |
          if [[ -f schema.version ]]; then
            version="$(tr -d '[:space:]' < schema.version)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "pull_request" && -f schema/event.schema.json ]]; then
              jq -e --arg version "$version" '.properties.schemaVersion.const == $version' \
                schema/event.schema.json >/dev/null
              echo "local=true" >> "$GITHUB_OUTPUT"
            else
              echo "local=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.schema.outputs.exists == 'true'
        run: |
          if [[ "${{ steps.schema.outputs.local }}" != "true" ]]; then
            mkdir -p schema
            cp schema-repo/event.schema.json schema/
          fi
          # Fail fast so contract tests can never skip silently (SA-11).
          test -f schema/event.schema.json
          jq -e --arg version "${{ steps.schema.outputs.version }}" \
            '.properties.schemaVersion.const == $version' schema/event.schema.json >/dev/null

      - name: Setup Python ${{ needs.params.outputs.ci_python_version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ needs.params.outputs.ci_python_version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Prefer hash-pinned lockfiles when present (reproducible,
          # tamper-evident installs - SR-3/SR-4); otherwise fall back to the
          # plain requirement files. With a lock the project is installed
          # --no-deps because the lock already pins the full closure.
          if [[ -f requirements.lock ]]; then
            pip install --require-hashes -r requirements.lock
            pip install --no-deps -e .
          else
            pip install -r requirements.txt
            pip install -e .
          fi
          if [[ -f requirements-dev.lock ]]; then
            pip install --require-hashes -r requirements-dev.lock
          elif [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          fi

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check src/ tests/ --output-format=github

      - name: Type check with mypy
        run: python -m mypy src/

      - name: Unit tests
        run: pytest -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing

      - name: Integration tests
        run: |
          pip install 'testcontainers[localstack]'
          pytest -m integration -v --tb=short
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: FIPS mode check (container)
        if: needs.params.outputs.docker_enabled == 'true'
        run: |
          set -euo pipefail
          if [[ ! -f "src/processor/infrastructure/fips.py" ]]; then
            echo "FIPS check skipped (processor module not found)"
            exit 0
          fi

          dockerfile="${{ needs.params.outputs.docker_dockerfile }}"
          if [[ -z "$dockerfile" || ! -f "$dockerfile" ]]; then
            echo "FIPS check skipped (dockerfile not found: $dockerfile)"
            exit 0
          fi

          image="fips-check:${{ github.sha }}"
          docker build -f "$dockerfile" -t "$image" .

          docker run --rm --entrypoint /bin/sh "$image" -c '
            set -euo pipefail
            if [[ -d /var/task/processor ]]; then
              export PYTHONPATH=/var/task
              cd /var/task
            elif [[ -d /app/src/processor ]]; then
              export PYTHONPATH=/app/src
              cd /app
            else
              echo "Processor package not found in image"
              exit 1
            fi

            python -c "from processor.infrastructure.fips import enforce_fips; enforce_fips(True); print(\"FIPS_OK\")"
          '

      - name: Dependency audit (pip-audit)
        shell: bash
        run: |
          set -euo pipefail
          pip install pip-audit

          audit_args=(--strict --desc)
          requirement_args=()
          # Audit the resolved lockfile pins when available - a pinned audit
          # is a stronger RA-5 signal than auditing >= ranges.
          if [[ -f requirements.lock ]]; then
            requirement_args+=(-r requirements.lock)
          elif [[ -f requirements.txt ]]; then
            requirement_args+=(-r requirements.txt)
          fi
          if [[ -f requirements-dev.lock ]]; then
            requirement_args+=(-r requirements-dev.lock)
          elif [[ -f requirements-dev.txt ]]; then
            requirement_args+=(-r requirements-dev.txt)
          fi

          if (( ${#requirement_args[@]} > 0 )); then
            pip-audit "${audit_args[@]}" "${requirement_args[@]}" \
              --format json --output pip-audit-report.json || true
            pip-audit "${audit_args[@]}" "${requirement_args[@]}"
          else
            pip-audit "${audit_args[@]}" --skip-editable \
              --format json --output pip-audit-report.json || true
            pip-audit "${audit_args[@]}" --skip-editable
          fi

      - name: Security static analysis (bandit)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll

      - name: Dependency vulnerability scan (safety)
        run: |
          pip install safety
          safety check --output json --save-json safety-report.json || true
          safety check

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file bom.json

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: sbom-cyclonedx
          path: bom.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload safety report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: env.CODECOV_TOKEN != ''
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          case "$(uname -m)" in
            x86_64)        arch="x64";   sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            aarch64|arm64) arch="arm64"; sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac

          tarball="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks

          /tmp/gitleaks git --redact --report-format json --report-path gitleaks-report.json .

      - name: Upload gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Semgrep (CE)
        run: |
          set -euo pipefail
          pipx install semgrep==1.165.0
          semgrep scan --metrics=off --severity ERROR \
            --config p/security-audit --config p/python \
            --json --output semgrep-report.json || true
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/security-audit --config p/python

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7
          if-no-files-found: ignore
  sonar:
    name: SonarCloud
    needs: [ params, build ]
    if: needs.params.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-report

      - name: Check for schema.version
        id: sonar-schema
        if: hashFiles('coverage.xml') == ''
        run: |
          if [[ -f schema.version ]]; then
            version="$(tr -d '[:space:]' < schema.version)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "pull_request" && -f schema/event.schema.json ]]; then
              jq -e --arg version "$version" '.properties.schemaVersion.const == $version' \
                schema/event.schema.json >/dev/null
              echo "local=true" >> "$GITHUB_OUTPUT"
            else
              echo "local=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: hashFiles('coverage.xml') == '' && steps.sonar-schema.outputs.exists == 'true' && steps.sonar-schema.outputs.local != 'true'
        id: sonar-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: hashFiles('coverage.xml') == '' && steps.sonar-schema.outputs.exists == 'true' && steps.sonar-schema.outputs.local != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.sonar-schema.outputs.version }}
          token: ${{ steps.sonar-app-token.outputs.token }}

      - name: Setup schema directory
        if: hashFiles('coverage.xml') == '' && steps.sonar-schema.outputs.exists == 'true'
        run: |
          if [[ "${{ steps.sonar-schema.outputs.local }}" != "true" ]]; then
            mkdir -p schema
            cp schema-repo/event.schema.json schema/
          fi
          test -f schema/event.schema.json
          jq -e --arg version "${{ steps.sonar-schema.outputs.version }}" \
            '.properties.schemaVersion.const == $version' schema/event.schema.json >/dev/null

      - name: Setup Python ${{ needs.params.outputs.ci_python_version }}
        if: hashFiles('coverage.xml') == ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ needs.params.outputs.ci_python_version }}
          cache: 'pip'

      - name: Generate coverage fallback
        if: hashFiles('coverage.xml') == ''
        run: |
          pip install --upgrade pip
          if [[ -f requirements.lock ]]; then
            pip install --require-hashes -r requirements.lock
            pip install --no-deps -e .
          else
            pip install -r requirements.txt
            pip install -e .
          fi
          if [[ -f requirements-dev.lock ]]; then
            pip install --require-hashes -r requirements-dev.lock
          elif [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          fi
          pytest -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ needs.params.outputs.sonar_organization }}
            -Dsonar.projectKey=${{ needs.params.outputs.sonar_project_key }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=${{ needs.params.outputs.ci_python_version }}
            -Dsonar.coverage.exclusions=**/__init__.py
  docker-build:
    name: Build and Scan Image
    needs: [ params, build, secret-scan, semgrep ]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          failure-threshold: error

      - name: Build Docker image
        id: image
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@a2852905e5da5a1088062e97dbaf1f63f8808e7f
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}-candidate-${{ github.sha }}
          registry: ${{ needs.params.outputs.docker_registry }}
          platforms: ${{ needs.params.outputs.docker_platforms }}
          push: ${{ github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch }}

      - name: Run Trivy scan
        uses: pauszek/fsamp-code-ci/.github/actions/security-scan@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          image-ref: ${{ steps.image.outputs.scan-ref }}
          severity: 'CRITICAL,HIGH'
          fail-on-vuln: 'true'
          upload-sarif: 'false'

  docker-publish:
    name: Publish Verified Image
    needs: [ params, build, docker-build, e2e-tests ]
    if: |
      needs.params.outputs.docker_enabled == 'true' &&
      github.event_name == 'push' &&
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.docker-build.result == 'success' &&
      needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Promote scanned digest
        shell: bash
        env:
          DIGEST: ${{ needs.docker-build.outputs.digest }}
          IMAGE_NAME: ${{ needs.params.outputs.docker_image_name }}
          REGISTRY: ${{ needs.params.outputs.docker_registry }}
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY" == "ghcr.io" ]] || {
            echo "::error::Registry promotion currently supports ghcr.io only"
            exit 1
          }
          test -n "$DIGEST"
          repository="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          echo "${{ github.token }}" | crane auth login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          crane tag "${repository}@${DIGEST}" "$VERSION"
          [[ "$(crane digest "${repository}:${VERSION}")" == "$DIGEST" ]]

  quality-gate:
    name: Release Quality Gate
    if: always()
    needs:
      - params
      - build
      - secret-scan
      - semgrep
      - sonar
      - docker-build
      - e2e-tests
      - docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Require all configured checks
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          DOCKER_ENABLED: ${{ needs.params.outputs.docker_enabled }}
          DOCKER_PUBLISH: ${{ needs.docker-publish.result }}
          E2E: ${{ needs.e2e-tests.result }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch }}
          PARAMS: ${{ needs.params.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_ENABLED: ${{ needs.params.outputs.sonar_enabled }}
        run: |
          set -euo pipefail
          require_success() {
            local name="$1" result="$2"
            [[ "$result" == "success" ]] || {
              echo "::error::${name} finished with ${result}"
              exit 1
            }
          }
          require_success params "$PARAMS"
          require_success build "$BUILD"
          require_success secret-scan "$SECRET_SCAN"
          require_success semgrep "$SEMGREP"
          if [[ "$SONAR_ENABLED" == "true" ]]; then
            require_success sonar "$SONAR"
          fi
          if [[ "$DOCKER_ENABLED" == "true" ]]; then
            require_success docker-build "$DOCKER_BUILD"
            require_success e2e-tests "$E2E"
            if [[ "$IS_RELEASE" == "true" ]]; then
              require_success docker-publish "$DOCKER_PUBLISH"
            fi
          fi

  tag-release:
    name: Tag and Release
    needs: [ params, quality-gate ]
    if: |
      needs.quality-gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create tag and release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ needs.params.outputs.release_full_release }}
          tag-prefix: v
  bump:
    name: Bump Version
    needs: [ params, build, tag-release ]
    if: |
      needs.params.outputs.bump_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Bump version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
  e2e-tests:
    name: E2E Tests
    needs: [ params, docker-build ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      needs.docker-build.result == 'success'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    timeout-minutes: 20
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra,fsamp-gateway,fsamp-processor

      - name: Checkout fsamp-infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Checkout this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: this-repo

      - name: Build this service image
        run: |
          cd this-repo
          docker build --target production --build-arg REQUIRE_FIPS_PROVIDER=false -t ${{ needs.params.outputs.docker_image_name }}:e2e-this .

      - name: Run E2E Tests
        uses: pauszek/fsamp-code-ci/.github/actions/run-e2e@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          this-image: ${{ needs.params.outputs.docker_image_name }}:e2e-this
          app-token: ${{ steps.app-token.outputs.token }}
          localstack-token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
