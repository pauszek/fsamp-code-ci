name: Build for Python Project

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: false
      GABRBA_SECRET:
        description: GitHub App private key for bump PRs
        required: false
      LOCALSTACK_AUTH_TOKEN:
        description: LocalStack Pro token for E2E tests
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # 1. PARAMS - Load Configuration
  # ---------------------------------------------------------------------------
  params:
    name: 📋 Load Configuration
    runs-on: ubuntu-latest
    outputs:
      ci_python_version: ${{ steps.out.outputs.ci_python_version }}
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      docker_enabled: ${{ steps.out.outputs.docker_enabled }}
      docker_image_name: ${{ steps.out.outputs.docker_image_name }}
      docker_registry: ${{ steps.out.outputs.docker_registry }}
      docker_dockerfile: ${{ steps.out.outputs.docker_dockerfile }}
      sonar_enabled: ${{ steps.out.outputs.sonar_enabled }}
      sonar_organization: ${{ steps.out.outputs.sonar_organization }}
      sonar_project_key: ${{ steps.out.outputs.sonar_project_key }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --disable-pip-version-check --no-input pyyaml

      - name: Parse .github/params.yml
        id: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, yaml
          
          path = ".github/params.yml"
          data = {}
          try:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              data = {}
          
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          docker = data.get("docker", {}) or {}
          sonar = data.get("sonar", {}) or {}
          
          def w(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"{k}={v}\n")
          
          # CI settings
          w("ci_python_version", ci.get("python-version", "3.11"))
          w("files_version", files.get("version", "release.version"))
          
          # Bump settings
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch", "main"))
          w("bump_label", bump.get("label", "autobump"))
          
          # Release settings
          w("release_full_release", str(rel.get("full-release", False)).lower())
          
          # Docker settings
          w("docker_enabled", str(docker.get("enabled", False)).lower())
          w("docker_image_name", docker.get("image-name", ""))
          w("docker_registry", docker.get("registry", "ghcr.io"))
          w("docker_dockerfile", docker.get("dockerfile", "Dockerfile"))
          
          # SonarCloud settings
          w("sonar_enabled", str(sonar.get("enabled", False)).lower())
          w("sonar_organization", sonar.get("organization", ""))
          w("sonar_project_key", sonar.get("project-key", ""))
          PY

      - name: Read version from file
        id: ver
        shell: bash
        run: |
          file="${{ steps.out.outputs.files_version }}"
          if [[ -s "$file" ]]; then
            echo "version=$(tr -d ' \r\n' < "$file")" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. BUILD - Lint, Test, Coverage
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Build & Test
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for schema.version file
        id: schema
        run: |
          if [ -f schema.version ]; then
            echo "version=$(tr -d '[:space:]' < schema.version)" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.schema.outputs.exists == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.schema.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.schema.outputs.exists == 'true'
        run: |
          mkdir -p schema
          cp schema-repo/event.schema.json schema/
          echo "✅ Schema v${{ steps.schema.outputs.version }} ready"

      - name: Setup Python ${{ needs.params.outputs.ci_python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.params.outputs.ci_python_version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e .

      - name: Run linting with Ruff
        run: |
          pip install ruff
          ruff check src/ tests/ --output-format=github

      - name: Run tests with pytest + coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # 3. SONAR - Code Quality Analysis
  # ---------------------------------------------------------------------------
  sonar:
    name: 📊 SonarCloud Analysis
    needs: [ params, build ]
    if: needs.params.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ needs.params.outputs.sonar_organization }}
            -Dsonar.projectKey=${{ needs.params.outputs.sonar_project_key }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=${{ needs.params.outputs.ci_python_version }}

  # ---------------------------------------------------------------------------
  # 4. DOCKER BUILD - Build Container Image
  # ---------------------------------------------------------------------------
  docker-build:
    name: 🐳 Build Docker Image
    needs: [ params, build ]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      scan-tag: ${{ steps.docker.outputs.scan-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Docker image
        id: docker
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@main
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          push: 'false'  # Don't push yet - wait for security scan

      - name: Save Docker image for scanning
        run: |
          docker save ${{ needs.params.outputs.docker_image_name }}:scan | gzip > docker-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 6. SECURITY SCAN - Vulnerability Scanning (Trivy)
  # ---------------------------------------------------------------------------
  security-scan:
    name: 🔒 Security Scan
    needs: [ params, docker-build ]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          gunzip -c docker-image.tar.gz | docker load

      - name: Run security scan
        uses: pauszek/fsamp-code-ci/.github/actions/security-scan@main
        with:
          image-ref: ${{ needs.params.outputs.docker_image_name }}:scan
          severity: 'CRITICAL,HIGH'
          fail-on-vuln: 'true'
          upload-sarif: 'false'  # Requires GitHub Advanced Security for private repos

  # ---------------------------------------------------------------------------
  # 7. DOCKER PUSH - Push to Registry (after security passes)
  # ---------------------------------------------------------------------------
  docker-push:
    name: 📦 Push to Registry
    needs: [ params, build, docker-build, security-scan ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and push Docker image
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@main
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          push: 'true'

  # ---------------------------------------------------------------------------
  # 8. TAG & RELEASE - Create Git Tag and GitHub Release
  # ---------------------------------------------------------------------------
  tag-release:
    name: 🏷️ Tag & Release
    needs: [ params, build ]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      full_release: ${{ steps.cfg.outputs.full_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure release outputs
        id: cfg
        shell: bash
        env:
          FULL: ${{ needs.params.outputs.release_full_release }}
        run: |
          set -euo pipefail
          echo "full_release=${FULL:-false}" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@main
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ steps.cfg.outputs.full_release }}
          tag-prefix: v

  # ---------------------------------------------------------------------------
  # 8b. UPDATE COMPATIBILITY - Notify fsamp-infra of new version
  # ---------------------------------------------------------------------------
  update-compatibility:
    name: 📋 Update Compatibility Matrix
    needs: [ params, tag-release ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Determine service name
        id: service
        run: |
          IMAGE_NAME="${{ needs.params.outputs.docker_image_name }}"
          if [[ "$IMAGE_NAME" == *"gateway"* ]]; then
            echo "name=gateway" >> "$GITHUB_OUTPUT"
          elif [[ "$IMAGE_NAME" == *"processor"* ]]; then
            echo "name=processor" >> "$GITHUB_OUTPUT"
          else
            echo "name=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify fsamp-infra to update compatibility matrix
        if: steps.service.outputs.name != 'unknown'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GABRBA_SECRET }}
          repository: pauszek/fsamp-infra
          event-type: update-compatibility
          client-payload: |
            {
              "service": "${{ steps.service.outputs.name }}",
              "version": "${{ needs.params.outputs.version }}"
            }

  # ---------------------------------------------------------------------------
  # 9. BUMP - Auto-bump Version via PR
  # ---------------------------------------------------------------------------
  bump:
    name: 🔄 Bump Version
    needs: [ params, build, tag-release ]
    if: |
      needs.params.outputs.bump_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch && 
      needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump release.version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@main
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}

  # ---------------------------------------------------------------------------
  # 10. E2E TESTS - Full Stack Integration Tests (after push)
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: 🧪 E2E Integration Tests
    needs: [ params, docker-push ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.docker-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      THIS_IMAGE: ${{ needs.params.outputs.docker_registry }}/${{ github.repository_owner }}/${{ needs.params.outputs.docker_image_name }}:${{ needs.params.outputs.version }}
      
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra,fsamp-gateway,fsamp-processor

      - name: Checkout fsamp-infra (E2E infrastructure)
        uses: actions/checkout@v5
        with:
          repository: pauszek/fsamp-infra
          path: infra
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq for YAML parsing
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve counterpart image from Compatibility Matrix
        id: images
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          
          IMAGE_NAME="${{ needs.params.outputs.docker_image_name }}"
          REGISTRY="${{ needs.params.outputs.docker_registry }}"
          OWNER="${{ github.repository_owner }}"
          COMPAT_FILE="infra/compatibility.yml"
          
          echo "═══════════════════════════════════════════════════════"
          echo "📋 Resolving E2E Test Images"
          echo "═══════════════════════════════════════════════════════"
          
          # Read current stable versions from compatibility matrix
          CURRENT_GATEWAY=$(yq '.current.gateway' "$COMPAT_FILE")
          CURRENT_PROCESSOR=$(yq '.current.processor' "$COMPAT_FILE")
          
          echo "Compatibility Matrix - Current Stable Versions:"
          echo "  Gateway:   ${CURRENT_GATEWAY}"
          echo "  Processor: ${CURRENT_PROCESSOR}"
          echo ""
          
          if [[ "$IMAGE_NAME" == *"gateway"* ]]; then
            # This is Gateway build - use just-built Gateway + stable Processor
            GATEWAY_IMAGE="$THIS_IMAGE"
            PROCESSOR_IMAGE="${REGISTRY}/${OWNER}/fsamp-processor:${CURRENT_PROCESSOR}"
            
            echo "🔨 Building: Gateway"
            echo "📦 This build:     ${GATEWAY_IMAGE}"
            echo "📦 Counterpart:    ${PROCESSOR_IMAGE} (from compatibility matrix)"
            
          elif [[ "$IMAGE_NAME" == *"processor"* ]]; then
            # This is Processor build - use stable Gateway + just-built Processor
            GATEWAY_IMAGE="${REGISTRY}/${OWNER}/fsamp-gateway:${CURRENT_GATEWAY}"
            PROCESSOR_IMAGE="$THIS_IMAGE"
            
            echo "🔨 Building: Processor"
            echo "📦 Counterpart:    ${GATEWAY_IMAGE} (from compatibility matrix)"
            echo "📦 This build:     ${PROCESSOR_IMAGE}"
            
          else
            echo "❌ Unknown service: $IMAGE_NAME"
            exit 1
          fi
          
          # Validate versions are not empty
          if [[ -z "$GATEWAY_IMAGE" ]] || [[ -z "$PROCESSOR_IMAGE" ]]; then
            echo "❌ ERROR: Could not resolve image versions"
            exit 1
          fi
          
          # Output
          echo "gateway_image=${GATEWAY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "processor_image=${PROCESSOR_IMAGE}" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "═══════════════════════════════════════════════════════"

      - name: Validate images (no latest allowed)
        run: |
          if [[ "${{ steps.images.outputs.gateway_image }}" == *":latest" ]] || \
             [[ "${{ steps.images.outputs.processor_image }}" == *":latest" ]]; then
            echo "❌ ERROR: 'latest' tag is forbidden in E2E tests"
            exit 1
          fi
          echo "✅ Images validated - no 'latest' tags"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          echo "Pulling Gateway: ${{ steps.images.outputs.gateway_image }}"
          docker pull "${{ steps.images.outputs.gateway_image }}"
          
          echo "Pulling Processor: ${{ steps.images.outputs.processor_image }}"
          docker pull "${{ steps.images.outputs.processor_image }}"

      - name: Start LocalStack
        working-directory: infra/e2e
        run: |
          docker compose up -d localstack
          
          echo "Waiting for LocalStack initialization..."
          timeout 180 bash -c 'until docker exec fsamp-e2e-localstack test -f /tmp/localstack-config/fsamp-config.env 2>/dev/null; do sleep 5; done'
          
          echo "✅ LocalStack initialized"
          docker exec fsamp-e2e-localstack cat /tmp/localstack-config/fsamp-config.env

      - name: Start application containers
        working-directory: infra/e2e
        env:
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway_image }}
          PROCESSOR_IMAGE: ${{ steps.images.outputs.processor_image }}
        run: |
          docker compose up -d gateway processor
          
          echo "Waiting for Gateway..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
          echo "✅ Gateway healthy"
          
          sleep 10
          echo "✅ Processor started"

      - name: Run E2E tests
        working-directory: infra/e2e
        env:
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway_image }}
          PROCESSOR_IMAGE: ${{ steps.images.outputs.processor_image }}
        run: |
          docker compose --profile test up --exit-code-from e2e-tests e2e-tests

      - name: Collect logs on failure
        if: failure()
        working-directory: infra/e2e
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "📋 E2E Test Failure - Collecting Logs"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "=== LocalStack ===" 
          docker logs fsamp-e2e-localstack 2>&1 | tail -100 || true
          echo ""
          echo "=== Gateway ==="
          docker logs fsamp-e2e-gateway 2>&1 | tail -100 || true
          echo ""
          echo "=== Processor ==="
          docker logs fsamp-e2e-processor 2>&1 | tail -100 || true

      - name: Cleanup
        if: always()
        working-directory: infra/e2e
        run: |
          docker compose down -v --remove-orphans || true
