name: Repo CI (no build)
on:
  workflow_call:
    secrets:
      GABRBA_SECRET:
        description: GitHub App private key for bump PRs
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load params
    runs-on: ubuntu-latest
    outputs:
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      release_publish: ${{ steps.out.outputs.release_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: pip3 install --disable-pip-version-check --no-input pyyaml
      - name: Parse .github/params.yml
        id: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, yaml
          path = ".github/params.yml"
          data = {}
          try:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              data = {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          def w(k,v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o: o.write(f"{k}={v}\n")
          w("files_version", files.get("version","release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch","main"))
          w("bump_label", bump.get("label","autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("release_publish", str(rel.get("publish", False)).lower())
          PY

  validate_schema:
    name: Validate JSON Schema
    needs: [ params ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect repository type
        id: detect
        shell: bash
        run: |
          if [[ -f event.schema.json ]]; then
            echo "has_schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_schema=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.detect.outputs.has_schema == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install validators
        if: steps.detect.outputs.has_schema == 'true'
        run: |
          pip install --quiet --disable-pip-version-check \
            'jsonschema>=4.20.0' \
            'check-jsonschema>=0.27.0'

      - name: Validate JSON syntax and metaschema
        if: steps.detect.outputs.has_schema == 'true'
        run: |
          set -euo pipefail
          python -c "import json; json.load(open('event.schema.json'))"
          check-jsonschema --check-metaschema event.schema.json

      - name: Verify schemaVersion alignment
        if: steps.detect.outputs.has_schema == 'true'
        shell: bash
        env:
          VERSION_FILE: ${{ needs.params.outputs.files_version }}
        run: |
          set -euo pipefail
          schema_version=$(python -c \
            "import json,sys; d=json.load(open('event.schema.json')); \
            v=d.get('properties',{}).get('schemaVersion',{}).get('const'); \
            print(v) if v else sys.exit('missing schemaVersion const')")
          [[ -s "${VERSION_FILE}" ]] || { echo "version file '${VERSION_FILE}' not found or empty"; exit 1; }
          release_version=$(tr -d '[:space:]' < "${VERSION_FILE}")
          python - "${schema_version}" "${release_version%%-*}" <<'PY'
          import re
          import sys

          def parse_version(value):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise SystemExit(f"invalid semantic version: {value}")
              return tuple(int(part) for part in match.groups())

          schema_version = sys.argv[1]
          release_version = sys.argv[2]

          if parse_version(release_version) < parse_version(schema_version):
              raise SystemExit(
                  f"schemaVersion={schema_version} but release version={release_version}"
              )

          print(f"schemaVersion {schema_version} aligned with release version {release_version}")
          PY

  tag_and_release:
    needs: [ params, validate_schema ]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      full_release: ${{ steps.cfg.outputs.full_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure release outputs
        id: cfg
        shell: bash
        env:
          FULL: ${{ needs.params.outputs.release_full_release }}
        run: |
          set -euo pipefail
          echo "full_release=${FULL:-false}" >> "$GITHUB_OUTPUT"

      - name: Tag and (pre)-release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@main
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ steps.cfg.outputs.full_release }}
          tag-prefix: v

  publish:
    needs: [ params, tag_and_release ]
    if: needs.params.outputs.release_publish == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch && needs.tag_and_release.outputs.full_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Publish package
        uses: pauszek/fsamp-code-ci/.github/actions/publish@main

  bump:
    needs: [ params, tag_and_release ]
    if: needs.params.outputs.bump_enabled == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch && needs.tag_and_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Bump release.version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@main
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
