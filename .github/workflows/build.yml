name: Build
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with explicit revision
        shell: bash
        run: |
          set -euo pipefail
          [[ -s 'release.version' ]] || { echo "Error: 'release.version' missing or empty."; exit 1; }
          REV="$(tr -d ' \r\n' < 'release.version')"
          mvn -B -ntp -Drevision="${REV}" verify