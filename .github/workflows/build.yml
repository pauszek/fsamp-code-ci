name: Build
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load params
    runs-on: ubuntu-latest
    outputs:
      ci_java_version: ${{ steps.out.outputs.ci_java_version }}
      ci_distribution: ${{ steps.out.outputs.ci_distribution }}
      files_version: ${{ steps.out.outputs.files_version }}
      qodana_enabled: ${{ steps.out.outputs.qodana_enabled }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: pip3 install --disable-pip-version-check --no-input pyyaml
      - name: Parse .github/params.yml
        id: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, yaml
          path = ".github/params.yml"
          data = {}
          try:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              data = {}
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          qod = data.get("qodana", {}) or {}
          bump = data.get("bump", {}) or {}
          def w(k,v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o: o.write(f"{k}={v}\n")
          w("ci_java_version", ci.get("java-version","21"))
          w("ci_distribution", ci.get("distribution","temurin"))
          w("files_version", files.get("version","release.version"))
          w("qodana_enabled", str(qod.get("enabled", False)).lower())
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch","main"))
          w("bump_label", bump.get("label","autobump"))
          PY

  build:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Maven Build
        uses: ./.github/actions/maven-build
        with:
          java-version: ${{ needs.params.outputs.ci_java_version }}
          distribution: ${{ needs.params.outputs.ci_distribution }}
          revision-file: ${{ needs.params.outputs.files_version }}

  qodana:
    needs: [ params, build ]
    if: needs.params.outputs.qodana_enabled == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Qodana
        uses: ./.github/actions/qodana-scan
        with:
          qodana-token: ${{ secrets.QODANA_TOKEN }}
          post-pr-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  bump:
    needs: [ params, build ]
    if: needs.params.outputs.bump_enabled == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump release.version via PR
        uses: ./.github/actions/bump-release-version
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}