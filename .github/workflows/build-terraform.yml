name: Build for Terraform Project
on:
  workflow_call:
    secrets:
      GABRBA_SECRET:
        description: GitHub App private key for bump PRs
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load params
    runs-on: ubuntu-latest
    outputs:
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      tf_working_directory: ${{ steps.out.outputs.tf_working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --disable-pip-version-check --no-input pyyaml

      - name: Parse .github/params.yml
        id: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, yaml
          path = ".github/params.yml"
          data = {}
          try:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              data = {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          tf = data.get("terraform", {}) or {}
          def w(k,v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o: o.write(f"{k}={v}\n")
          w("files_version", files.get("version","release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch","main"))
          w("bump_label", bump.get("label","autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("tf_working_directory", tf.get("working-directory","terraform"))
          PY

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          case "$(uname -m)" in
            x86_64)        arch="x64";   sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            aarch64|arm64) arch="arm64"; sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac

          tarball="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks

          /tmp/gitleaks git --redact --report-format json --report-path gitleaks-report.json .

      - name: Upload gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  terraform:
    name: Terraform Validate
    needs: params
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.params.outputs.tf_working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.4"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (validation only)
        run: |
          if compgen -G "environments/*/" > /dev/null 2>&1; then
            for env in environments/*/; do
              echo "::group::Init $env"
              terraform -chdir="$env" init -backend=false
              echo "::endgroup::"
            done
          else
            echo "::group::Init root"
            terraform init -backend=false
            echo "::endgroup::"
          fi

      - name: Terraform Validate
        run: |
          if compgen -G "environments/*/" > /dev/null 2>&1; then
            for env in environments/*/; do
              echo "::group::Validate $env"
              terraform -chdir="$env" validate
              echo "::endgroup::"
            done
          else
            echo "::group::Validate root"
            terraform validate
            echo "::endgroup::"
          fi

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Run Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@fa9edf8f0a491c59a924ea6accd5bdcf07752cff # v12
        with:
          directory: ${{ needs.params.outputs.tf_working_directory }}
          framework: terraform
          config_file: .checkov.yml
          soft_fail: false
          hard_fail_on: HIGH,CRITICAL
          soft_fail_on: LOW,MEDIUM
          output_format: cli
          download_external_modules: false

  tag_and_release:
    name: Tag and Release
    needs: [ params, terraform, secret-scan ]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      full_release: ${{ steps.cfg.outputs.full_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure release outputs
        id: cfg
        shell: bash
        env:
          FULL: ${{ needs.params.outputs.release_full_release }}
        run: |
          set -euo pipefail
          echo "full_release=${FULL:-false}" >> "$GITHUB_OUTPUT"

      - name: Tag and (pre)-release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ steps.cfg.outputs.full_release }}
          tag-prefix: v

  bump:
    name: Bump Version
    needs: [ params, terraform, tag_and_release ]
    if: needs.params.outputs.bump_enabled == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch && needs.tag_and_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Bump release.version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
