name: CI
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

jobs:
  workflow-lint:
    name: Validate reusable workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          echo "${GOBIN}" >> "$GITHUB_PATH"

      - name: Lint workflows and shell scripts
        run: actionlint -color

      - name: Require immutable action references
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          invalid = []
          paths = [*pathlib.Path(".github").rglob("*.yml"), *pathlib.Path(".github").rglob("*.yaml")]
          for path in paths:
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.match(r"^\s*uses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  target = match.group(1)
                  if target.startswith("./"):
                      continue
                  ref = target.rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      invalid.append(f"{path}:{number}: {target}")

          if invalid:
              print("Mutable action references:\n" + "\n".join(invalid))
              sys.exit(1)
          PY

      - name: Verify release safeguards
        run: bash scripts/verify-release-safeguards.sh

      - name: Test E2E reference selection
        run: bash scripts/test-select-e2e-ref.sh

  build-lite:
    uses: ./.github/workflows/build-lite.yml
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
