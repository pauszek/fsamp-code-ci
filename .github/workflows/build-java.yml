name: Build for Java Project

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: false
      GABRBA_SECRET:
        description: GitHub App private key for cross-repo access
        required: false
      LOCALSTACK_AUTH_TOKEN:
        description: LocalStack Pro token for E2E tests
        required: false
      NVD_API_KEY:
        description: NIST NVD API key for OWASP Dependency-Check
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load Configuration
    runs-on: ubuntu-latest
    outputs:
      ci_java_version: ${{ steps.out.outputs.ci_java_version }}
      ci_distribution: ${{ steps.out.outputs.ci_distribution }}
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      docker_enabled: ${{ steps.out.outputs.docker_enabled }}
      docker_image_name: ${{ steps.out.outputs.docker_image_name }}
      docker_registry: ${{ steps.out.outputs.docker_registry }}
      docker_dockerfile: ${{ steps.out.outputs.docker_dockerfile }}
      docker_platforms: ${{ steps.out.outputs.docker_platforms }}
      docker_runner: ${{ steps.out.outputs.docker_runner }}
      sonar_enabled: ${{ steps.out.outputs.sonar_enabled }}
      sonar_organization: ${{ steps.out.outputs.sonar_organization }}
      sonar_project_key: ${{ steps.out.outputs.sonar_project_key }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --quiet --disable-pip-version-check pyyaml

      - name: Parse .github/params.yml
        id: out
        run: |
          python3 - <<'PY'
          import os, yaml
          
          data = {}
          try:
              with open(".github/params.yml") as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              pass
          
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          docker = data.get("docker", {}) or {}
          sonar = data.get("sonar", {}) or {}
          
          def w(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"{k}={v}\n")
          
          w("ci_java_version", ci.get("java-version", "21"))
          w("ci_distribution", ci.get("distribution", "temurin"))
          w("files_version", files.get("version", "release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch", "main"))
          w("bump_label", bump.get("label", "autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("docker_enabled", str(docker.get("enabled", False)).lower())
          w("docker_image_name", docker.get("image-name", ""))
          w("docker_registry", docker.get("registry", "ghcr.io"))
          w("docker_dockerfile", docker.get("dockerfile", "Dockerfile"))
          w("docker_platforms", docker.get("platforms", "linux/arm64"))
          w("docker_runner", docker.get("runner", "ubuntu-24.04-arm"))
          w("sonar_enabled", str(sonar.get("enabled", False)).lower())
          w("sonar_organization", sonar.get("organization", ""))
          w("sonar_project_key", sonar.get("project-key", ""))
          PY

      - name: Read version
        id: ver
        run: |
          file="${{ steps.out.outputs.files_version }}"
          [[ -s "$file" ]] && echo "version=$(tr -d ' \r\n' < "$file")" >> "$GITHUB_OUTPUT" || echo "version=0.0.0" >> "$GITHUB_OUTPUT"
  build:
    name: Build and Test
    needs: params
    runs-on: ${{ needs.params.outputs.docker_runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for schema.version
        id: schema
        run: |
          if [[ -f schema.version ]]; then
            echo "version=$(tr -d '[:space:]' < schema.version)" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.schema.outputs.exists == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.schema.outputs.exists == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.schema.outputs.exists == 'true'
        run: |
          mkdir -p schema
          cp schema-repo/event.schema.json schema/
          # Fail fast so contract tests can never skip silently (SA-11).
          test -f schema/event.schema.json

      - name: Setup Java ${{ needs.params.outputs.ci_java_version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} test

      - name: Integration tests
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} failsafe:integration-test failsafe:verify
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: FIPS 140-3 crypto provider tests
        # Always run when running on Corretto (ACCP requires Corretto JVM).
        # If a downstream repository overrides ci.distribution to a different
        # JDK distribution, this step is skipped and the FipsCryptoConfigTest
        # remains gated by its @EnabledIf("isACCPAvailable") condition.
        if: needs.params.outputs.ci_distribution == 'corretto'
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} test \
            -Dgroups=fips \
            -Dspring.profiles.active=fips-test \
            -Dorg.bouncycastle.fips.approved_only=true

      - name: Generate SBOM (CycloneDX)
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} package -DskipTests -q

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: target/classes/META-INF/sbom/application.cdx.json
          retention-days: 14
          if-no-files-found: warn

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          case "$(uname -m)" in
            x86_64)        arch="x64";   sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            aarch64|arm64) arch="arm64"; sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac

          tarball="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks

          /tmp/gitleaks git --redact --report-format json --report-path gitleaks-report.json .

      - name: Upload gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Semgrep (CE)
        run: |
          set -euo pipefail
          pipx install semgrep==1.165.0
          semgrep scan --metrics=off --severity ERROR \
            --config p/security-audit --config p/java \
            --json --output semgrep-report.json || true
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/security-audit --config p/java

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7
          if-no-files-found: ignore
  sonar:
    name: SonarCloud
    needs: [ params, build ]
    if: needs.params.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco
        continue-on-error: true

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} \
            verify -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ needs.params.outputs.sonar_organization }} \
            -Dsonar.projectKey=${{ needs.params.outputs.sonar_project_key }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  dependency-check:
    name: OWASP Dependency-Check
    needs: [ params, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Compute OWASP cache key
        id: owasp-cache-key
        shell: bash
        run: |
          {
            echo "date=$(date -u +%Y-%m-%d)"
            echo "key=dependency-check-${{ runner.os }}-$(date -u +%Y-%m-%d)-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check data
        id: owasp-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .dependency-check-data
          key: ${{ steps.owasp-cache-key.outputs.key }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ steps.owasp-cache-key.outputs.date }}-
            dependency-check-${{ runner.os }}-

      - name: Inspect restored OWASP Dependency-Check data
        shell: bash
        run: |
          echo "OWASP cache hit: ${{ steps.owasp-cache.outputs.cache-hit }}"
          echo "OWASP cache matched key: ${{ steps.owasp-cache.outputs.cache-matched-key }}"
          if [[ -d .dependency-check-data ]] && [[ -n "$(find .dependency-check-data -type f -print -quit)" ]]; then
            du -sh .dependency-check-data || true
            find .dependency-check-data -maxdepth 2 -type f | sort | sed -n '1,25p'
            find .dependency-check-data -type f -name "*.lock" -print -delete
          else
            echo "No restored OWASP data found."
          fi

      - name: OWASP Dependency-Check
        shell: bash
        timeout-minutes: 40
        run: |
          set -o pipefail

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_delay="${NVD_API_DELAY:-1000}"
            echo "NVD API key configured: yes"
          else
            nvd_delay="${NVD_API_DELAY:-8000}"
            echo "::warning title=Missing NVD_API_KEY::Configure the NVD_API_KEY repository or organization secret to avoid slow OWASP Dependency-Check NVD updates."
          fi
          nvd_max_retry_count="${NVD_MAX_RETRY_COUNT:-10}"

          run_dependency_check() {
            mvn -B -ntp \
              -Drevision=${{ needs.params.outputs.version }} \
              -DdataDirectory="${PWD}/.dependency-check-data" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              -DnvdApiDelay="${nvd_delay}" \
              -DnvdMaxRetryCount="${nvd_max_retry_count}" \
              -DnvdValidForHours=24 \
              verify -DskipTests -Psecurity 2>&1 | tee dependency-check-maven.log
          }

          run_dependency_check
          status=$?

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if grep -Eiq 'Error updating the NVD Data|NVD Returned Status Code: 429|Unable to access the local database|Unable to obtain an exclusive lock|WriteLockException|NoDataException|database has been closed|odc\.mv\.db|odc\.update\.lock' dependency-check-maven.log; then
            echo "::warning::Dependency-Check data update failed; clearing cached data and retrying once."
            rm -rf .dependency-check-data
            run_dependency_check
            exit $?
          fi

          exit "$status"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_API_DELAY: ${{ vars.NVD_API_DELAY }}
          NVD_MAX_RETRY_COUNT: ${{ vars.NVD_MAX_RETRY_COUNT }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 7

      - name: Inspect OWASP Dependency-Check data
        id: owasp-data
        if: always()
        shell: bash
        run: |
          if [[ -d .dependency-check-data ]] && [[ -n "$(find .dependency-check-data -type f -print -quit)" ]]; then
            find .dependency-check-data -type f -name "*.lock" -print -delete
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "OWASP Dependency-Check data directory:"
            du -sh .dependency-check-data || true
            find .dependency-check-data -maxdepth 2 -type f | sort | sed -n '1,25p'
            if [[ -f target/dependency-check-report.json ]] || grep -q "Check for updates complete" dependency-check-maven.log 2>/dev/null; then
              echo "cacheable=true" >> "$GITHUB_OUTPUT"
            else
              echo "cacheable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::OWASP Dependency-Check data was not fully updated; skipping cache save."
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OWASP Dependency-Check did not create cacheable data; skipping cache save."
          fi

      - name: Save OWASP Dependency-Check data
        if: always() && steps.owasp-data.outputs.present == 'true' && steps.owasp-data.outputs.cacheable == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .dependency-check-data
          key: ${{ steps.owasp-cache-key.outputs.key }}
  docker-build:
    name: Build and Scan Image
    needs: [ params, build, secret-scan, semgrep ]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          failure-threshold: error

      - name: Build Docker image
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          platforms: ${{ needs.params.outputs.docker_platforms }}
          push: 'false'

      - name: Run Trivy scan
        uses: pauszek/fsamp-code-ci/.github/actions/security-scan@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          image-ref: ${{ needs.params.outputs.docker_image_name }}:scan
          severity: 'CRITICAL,HIGH'
          fail-on-vuln: 'true'
          upload-sarif: 'false'
  docker-push:
    name: Push to Registry
    needs: [ params, build, docker-build, e2e-tests ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.docker-build.result == 'success' &&
      needs.e2e-tests.result == 'success'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build and push
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          platforms: ${{ needs.params.outputs.docker_platforms }}
          push: 'true'
  tag-release:
    name: Tag and Release
    needs: [ params, build, secret-scan, semgrep ]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create tag and release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ needs.params.outputs.release_full_release }}
          tag-prefix: v
  bump:
    name: Bump Version
    needs: [ params, build, tag-release ]
    if: |
      needs.params.outputs.bump_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Bump version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
  e2e-tests:
    name: E2E Tests
    needs: [ params, docker-build ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      needs.docker-build.result == 'success'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    timeout-minutes: 20
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra,fsamp-gateway,fsamp-processor

      - name: Checkout fsamp-infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Checkout this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: this-repo

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build this service image
        run: |
          cd this-repo
          ./mvnw clean package -DskipTests -q
          docker build -t ${{ needs.params.outputs.docker_image_name }}:e2e-this .

      - name: Run E2E Tests
        uses: pauszek/fsamp-code-ci/.github/actions/run-e2e@f2403eed5b5a9f172474b102eea06c465a5bff18
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          this-image: ${{ needs.params.outputs.docker_image_name }}:e2e-this
          app-token: ${{ steps.app-token.outputs.token }}
          localstack-token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
