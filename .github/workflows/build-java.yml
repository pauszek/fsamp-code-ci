name: Build for Java Project

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: false
      GABRBA_SECRET:
        description: GitHub App private key for cross-repo access
        required: false
      LOCALSTACK_AUTH_TOKEN:
        description: LocalStack Pro token for E2E tests
        required: false
      NVD_API_KEY:
        description: NIST NVD API key for OWASP Dependency-Check
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load Configuration
    runs-on: ubuntu-latest
    outputs:
      ci_java_version: ${{ steps.out.outputs.ci_java_version }}
      ci_distribution: ${{ steps.out.outputs.ci_distribution }}
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      docker_enabled: ${{ steps.out.outputs.docker_enabled }}
      docker_image_name: ${{ steps.out.outputs.docker_image_name }}
      docker_registry: ${{ steps.out.outputs.docker_registry }}
      docker_dockerfile: ${{ steps.out.outputs.docker_dockerfile }}
      docker_platforms: ${{ steps.out.outputs.docker_platforms }}
      docker_runner: ${{ steps.out.outputs.docker_runner }}
      sonar_enabled: ${{ steps.out.outputs.sonar_enabled }}
      sonar_organization: ${{ steps.out.outputs.sonar_organization }}
      sonar_project_key: ${{ steps.out.outputs.sonar_project_key }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --quiet --disable-pip-version-check pyyaml

      - name: Parse .github/params.yml
        id: out
        run: |
          python3 - <<'PY'
          import os, yaml
          
          data = {}
          try:
              with open(".github/params.yml") as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              pass
          
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          docker = data.get("docker", {}) or {}
          sonar = data.get("sonar", {}) or {}
          
          def w(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"{k}={v}\n")
          
          w("ci_java_version", ci.get("java-version", "21"))
          w("ci_distribution", ci.get("distribution", "temurin"))
          w("files_version", files.get("version", "release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch", "main"))
          w("bump_label", bump.get("label", "autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("docker_enabled", str(docker.get("enabled", False)).lower())
          w("docker_image_name", docker.get("image-name", ""))
          w("docker_registry", docker.get("registry", "ghcr.io"))
          w("docker_dockerfile", docker.get("dockerfile", "Dockerfile"))
          w("docker_platforms", docker.get("platforms", "linux/arm64"))
          w("docker_runner", docker.get("runner", "ubuntu-24.04-arm"))
          w("sonar_enabled", str(sonar.get("enabled", False)).lower())
          w("sonar_organization", sonar.get("organization", ""))
          w("sonar_project_key", sonar.get("project-key", ""))
          PY

      - name: Read version
        id: ver
        run: |
          file="${{ steps.out.outputs.files_version }}"
          [[ -s "$file" ]] && echo "version=$(tr -d ' \r\n' < "$file")" >> "$GITHUB_OUTPUT" || echo "version=0.0.0" >> "$GITHUB_OUTPUT"
  build:
    name: Build and Test
    needs: params
    runs-on: ${{ needs.params.outputs.docker_runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for schema.version
        id: schema
        run: |
          if [[ -f schema.version ]]; then
            version="$(tr -d '[:space:]' < schema.version)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "pull_request" && -f schema/event.schema.json ]]; then
              jq -e --arg version "$version" '.properties.schemaVersion.const == $version' \
                schema/event.schema.json >/dev/null
              echo "local=true" >> "$GITHUB_OUTPUT"
            else
              echo "local=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.schema.outputs.exists == 'true'
        run: |
          if [[ "${{ steps.schema.outputs.local }}" != "true" ]]; then
            mkdir -p schema
            cp schema-repo/event.schema.json schema/
          fi
          # Fail fast so contract tests can never skip silently (SA-11).
          test -f schema/event.schema.json
          jq -e --arg version "${{ steps.schema.outputs.version }}" \
            '.properties.schemaVersion.const == $version' schema/event.schema.json >/dev/null

      - name: Setup Java ${{ needs.params.outputs.ci_java_version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Build and verify with Maven
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} clean verify
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: FIPS 140-3 crypto provider tests
        # Always run when running on Corretto (ACCP requires Corretto JVM).
        # If a downstream repository overrides ci.distribution to a different
        # JDK distribution, this provider-specific step is not applicable.
        if: needs.params.outputs.ci_distribution == 'corretto'
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} \
            -P fips-tests test \
            -DfailIfNoTests=true \
            -Dspring.profiles.active=fips-test \
            -Dorg.bouncycastle.fips.approved_only=true

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: sbom-cyclonedx
          path: target/classes/META-INF/sbom/application.cdx.json
          retention-days: 14
          if-no-files-found: warn

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          case "$(uname -m)" in
            x86_64)        arch="x64";   sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            aarch64|arm64) arch="arm64"; sha256="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac

          tarball="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks

          /tmp/gitleaks git --redact --report-format json --report-path gitleaks-report.json .

      - name: Upload gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Semgrep (CE)
        run: |
          set -euo pipefail
          pipx install semgrep==1.165.0
          semgrep scan --metrics=off --severity ERROR \
            --config p/security-audit --config p/java \
            --json --output semgrep-report.json || true
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/security-audit --config p/java

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7
          if-no-files-found: ignore
  sonar:
    name: SonarCloud
    needs: [ params, build ]
    if: needs.params.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco
        continue-on-error: true

      - name: Inspect coverage report
        id: coverage
        shell: bash
        run: |
          if [[ -s target/site/jacoco/jacoco.xml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::JaCoCo artifact is missing; regenerating coverage before SonarCloud analysis."
          fi

      - name: Check for schema.version
        if: steps.coverage.outputs.present != 'true'
        id: schema
        shell: bash
        run: |
          if [[ -f schema.version ]]; then
            version="$(tr -d '[:space:]' < schema.version)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "pull_request" && -f schema/event.schema.json ]]; then
              jq -e --arg version "$version" '.properties.schemaVersion.const == $version' \
                schema/event.schema.json >/dev/null
              echo "local=true" >> "$GITHUB_OUTPUT"
            else
              echo "local=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.coverage.outputs.present != 'true' && steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.coverage.outputs.present != 'true' && steps.schema.outputs.exists == 'true' && steps.schema.outputs.local != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.coverage.outputs.present != 'true' && steps.schema.outputs.exists == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.schema.outputs.local }}" != "true" ]]; then
            mkdir -p schema
            cp schema-repo/event.schema.json schema/
          fi
          test -f schema/event.schema.json
          jq -e --arg version "${{ steps.schema.outputs.version }}" \
            '.properties.schemaVersion.const == $version' schema/event.schema.json >/dev/null

      - name: Regenerate coverage when artifact is missing
        if: steps.coverage.outputs.present != 'true'
        shell: bash
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} test jacoco:report
          test -s target/site/jacoco/jacoco.xml

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} \
            verify -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ needs.params.outputs.sonar_organization }} \
            -Dsonar.projectKey=${{ needs.params.outputs.sonar_project_key }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  dependency-check:
    name: OWASP Dependency-Check
    needs: [ params, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Compute OWASP cache key
        id: owasp-cache-key
        shell: bash
        run: |
          {
            echo "date=$(date -u +%Y-%m-%d)"
            echo "key=dependency-check-${{ runner.os }}-$(date -u +%Y-%m-%d)-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check data
        id: owasp-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .dependency-check-data
          key: ${{ steps.owasp-cache-key.outputs.key }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ steps.owasp-cache-key.outputs.date }}-
            dependency-check-${{ runner.os }}-

      - name: Inspect restored OWASP Dependency-Check data
        id: owasp-cache-state
        shell: bash
        run: |
          echo "OWASP cache hit: ${{ steps.owasp-cache.outputs.cache-hit }}"
          echo "OWASP cache matched key: ${{ steps.owasp-cache.outputs.cache-matched-key }}"
          if [[ -d .dependency-check-data ]] && [[ -n "$(find .dependency-check-data -type f -print -quit)" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            du -sh .dependency-check-data || true
            find .dependency-check-data -maxdepth 2 -type f | sort | sed -n '1,25p'
            find .dependency-check-data -type f -name "*.lock" -print -delete
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No restored OWASP data found."
          fi

      - name: OWASP Dependency-Check
        shell: bash
        timeout-minutes: 80
        run: |
          set -o pipefail

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_delay="${NVD_API_DELAY:-1000}"
            echo "NVD API key configured: yes"
          else
            nvd_delay="${NVD_API_DELAY:-8000}"
            echo "::warning title=Missing NVD_API_KEY::Configure the NVD_API_KEY repository or organization secret to avoid slow OWASP Dependency-Check NVD updates."
          fi
          nvd_max_retry_count="${NVD_MAX_RETRY_COUNT:-10}"
          nvd_valid_for_hours="${NVD_VALID_FOR_HOURS:-336}"

          if ! [[ "${nvd_valid_for_hours}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid NVD_VALID_FOR_HOURS::NVD_VALID_FOR_HOURS must be a positive integer."
            exit 1
          fi
          echo "NVD data valid for hours: ${nvd_valid_for_hours}"

          owasp_auto_update="${OWASP_AUTO_UPDATE:-}"
          if [[ -z "${owasp_auto_update}" ]]; then
            owasp_auto_update="false"
          fi

          if [[ "${owasp_auto_update}" != "true" && "${owasp_auto_update}" != "false" ]]; then
            echo "::error title=Invalid OWASP_AUTO_UPDATE::OWASP_AUTO_UPDATE must be true or false."
            exit 1
          fi

          if [[ "${OWASP_CACHE_PRESENT}" != "true" && "${owasp_auto_update}" == "false" ]]; then
            echo "::notice title=OWASP cache warmup::No restored Dependency-Check data is available; enabling a live NVD refresh."
            owasp_auto_update="true"
          fi

          if [[ "${owasp_auto_update}" == "false" ]]; then
            echo "::notice title=OWASP cached scan::Using restored Dependency-Check data without live NVD update. Set OWASP_AUTO_UPDATE=true to force refresh."
          fi
          echo "OWASP auto-update: ${owasp_auto_update}"

          run_dependency_check() {
            mvn -B -ntp \
              -Drevision=${{ needs.params.outputs.version }} \
              -DdataDirectory="${PWD}/.dependency-check-data" \
              -DautoUpdate="${owasp_auto_update}" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              -DnvdApiDelay="${nvd_delay}" \
              -DnvdMaxRetryCount="${nvd_max_retry_count}" \
              -DnvdValidForHours="${nvd_valid_for_hours}" \
              verify -DskipTests -Psecurity 2>&1 | tee dependency-check-maven.log
          }

          # The step runs with errexit; guard the calls so a failure reaches
          # the retry logic below instead of terminating the script.
          status=0
          run_dependency_check || status=$?

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if [[ "${owasp_auto_update}" == "true" ]] && grep -Eiq 'Error updating the NVD Data|NVD Returned Status Code: 429|Unable to access the local database|Unable to obtain an exclusive lock|WriteLockException|NoDataException|database has been closed|odc\.mv\.db|odc\.update\.lock' dependency-check-maven.log; then
            echo "::warning::Dependency-Check data update failed; clearing cached data and retrying once."
            rm -rf .dependency-check-data
            status=0
            run_dependency_check || status=$?
          fi

          exit "$status"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_API_DELAY: ${{ vars.NVD_API_DELAY }}
          NVD_MAX_RETRY_COUNT: ${{ vars.NVD_MAX_RETRY_COUNT }}
          NVD_VALID_FOR_HOURS: ${{ vars.NVD_VALID_FOR_HOURS }}
          OWASP_AUTO_UPDATE: ${{ vars.OWASP_AUTO_UPDATE }}
          OWASP_CACHE_PRESENT: ${{ steps.owasp-cache-state.outputs.present }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 7

      - name: Inspect OWASP Dependency-Check data
        id: owasp-data
        if: always()
        shell: bash
        run: |
          if [[ -d .dependency-check-data ]] && [[ -n "$(find .dependency-check-data -type f -print -quit)" ]]; then
            find .dependency-check-data -type f -name "*.lock" -print -delete
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "OWASP Dependency-Check data directory:"
            du -sh .dependency-check-data || true
            find .dependency-check-data -maxdepth 2 -type f | sort | sed -n '1,25p'
            if [[ -f target/dependency-check-report.json ]] || grep -q "Check for updates complete" dependency-check-maven.log 2>/dev/null; then
              echo "cacheable=true" >> "$GITHUB_OUTPUT"
            else
              echo "cacheable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::OWASP Dependency-Check data was not fully updated; skipping cache save."
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OWASP Dependency-Check did not create cacheable data; skipping cache save."
          fi

      - name: Save OWASP Dependency-Check data
        if: always() && steps.owasp-data.outputs.present == 'true' && steps.owasp-data.outputs.cacheable == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .dependency-check-data
          key: ${{ steps.owasp-cache-key.outputs.key }}
  docker-build:
    name: Build and Scan Image
    needs: [ params, build, secret-scan, semgrep ]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      scan_ref: ${{ steps.image.outputs.scan-ref }}
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          failure-threshold: error

      - name: Build Docker image
        id: image
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@9dfa7ae8edd9017f3270f0d15db2aa3767d3a309
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}-candidate-${{ github.sha }}
          registry: ${{ needs.params.outputs.docker_registry }}
          platforms: ${{ needs.params.outputs.docker_platforms }}
          push: ${{ github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch }}

      - name: Run Trivy scan
        uses: pauszek/fsamp-code-ci/.github/actions/security-scan@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          image-ref: ${{ steps.image.outputs.scan-ref }}
          severity: 'CRITICAL,HIGH'
          fail-on-vuln: 'true'
          upload-sarif: 'false'

      - name: Export scanned candidate for E2E
        if: github.event_name != 'push' || github.ref_name != needs.params.outputs.bump_base_branch
        shell: bash
        env:
          SCAN_REF: ${{ steps.image.outputs.scan-ref }}
        run: |
          set -euo pipefail
          docker save "${SCAN_REF}" | gzip -1 > candidate-image.tar.gz

      - name: Upload scanned candidate for E2E
        if: github.event_name != 'push' || github.ref_name != needs.params.outputs.bump_base_branch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-image-${{ github.sha }}
          path: candidate-image.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  docker-publish:
    name: Publish Verified Image
    needs: [ params, build, docker-build, e2e-tests, dependency-check, sonar ]
    # sonar is optional per params.yml, so a skipped sonar job must not veto
    # the promotion; every other gate has to succeed before the digest is tagged.
    if: |
      !cancelled() &&
      needs.params.result == 'success' &&
      needs.params.outputs.docker_enabled == 'true' &&
      github.event_name == 'push' &&
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.build.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.dependency-check.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Promote scanned digest
        shell: bash
        env:
          DIGEST: ${{ needs.docker-build.outputs.digest }}
          IMAGE_NAME: ${{ needs.params.outputs.docker_image_name }}
          REGISTRY: ${{ needs.params.outputs.docker_registry }}
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY" == "ghcr.io" ]] || {
            echo "::error::Registry promotion currently supports ghcr.io only"
            exit 1
          }
          test -n "$DIGEST"
          repository="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          echo "${{ github.token }}" | crane auth login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          crane tag "${repository}@${DIGEST}" "$VERSION"
          [[ "$(crane digest "${repository}:${VERSION}")" == "$DIGEST" ]]

  quality-gate:
    name: Release Quality Gate
    if: always()
    needs:
      - params
      - build
      - secret-scan
      - semgrep
      - sonar
      - dependency-check
      - docker-build
      - e2e-tests
      - docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Require all configured checks
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          DEPENDENCY_CHECK: ${{ needs.dependency-check.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          DOCKER_ENABLED: ${{ needs.params.outputs.docker_enabled }}
          DOCKER_PUBLISH: ${{ needs.docker-publish.result }}
          E2E: ${{ needs.e2e-tests.result }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch }}
          PARAMS: ${{ needs.params.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_ENABLED: ${{ needs.params.outputs.sonar_enabled }}
        run: |
          set -euo pipefail
          require_success() {
            local name="$1" result="$2"
            [[ "$result" == "success" ]] || {
              echo "::error::${name} finished with ${result}"
              exit 1
            }
          }
          require_success params "$PARAMS"
          require_success build "$BUILD"
          require_success secret-scan "$SECRET_SCAN"
          require_success semgrep "$SEMGREP"
          require_success dependency-check "$DEPENDENCY_CHECK"
          if [[ "$SONAR_ENABLED" == "true" ]]; then
            require_success sonar "$SONAR"
          fi
          if [[ "$DOCKER_ENABLED" == "true" ]]; then
            require_success docker-build "$DOCKER_BUILD"
            require_success e2e-tests "$E2E"
            if [[ "$IS_RELEASE" == "true" ]]; then
              require_success docker-publish "$DOCKER_PUBLISH"
            fi
          fi

  tag-release:
    name: Tag and Release
    needs: [ params, quality-gate ]
    if: |
      needs.quality-gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create tag and release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ needs.params.outputs.release_full_release }}
          tag-prefix: v
  bump:
    name: Bump Version
    needs: [ params, build, tag-release ]
    if: |
      needs.params.outputs.bump_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Bump version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@8d6ea616a4c8082315c46fd81e02d69815625d01
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
  e2e-tests:
    name: E2E Tests
    needs: [ params, docker-build ]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      needs.docker-build.result == 'success'
    runs-on: ${{ needs.params.outputs.docker_runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra,fsamp-gateway,fsamp-processor

      - name: Checkout fsamp-infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pauszek/fsamp-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Download scanned candidate
        if: github.event_name != 'push' || github.ref_name != needs.params.outputs.bump_base_branch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-image-${{ github.sha }}
          path: .

      - name: Load scanned candidate
        if: github.event_name != 'push' || github.ref_name != needs.params.outputs.bump_base_branch
        run: gzip -dc candidate-image.tar.gz | docker load

      - name: Log in for immutable candidate
        if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
        shell: bash
        env:
          REGISTRY: ${{ needs.params.outputs.docker_registry }}
        run: |
          set -euo pipefail
          [[ "${REGISTRY}" == "ghcr.io" ]]
          echo "${{ github.token }}" | docker login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Verify local scanned candidate
        if: github.event_name != 'push' || github.ref_name != needs.params.outputs.bump_base_branch
        shell: bash
        env:
          SCAN_REF: ${{ needs.docker-build.outputs.scan_ref }}
        run: |
          set -euo pipefail
          docker image inspect "${SCAN_REF}" >/dev/null 2>&1 || {
            echo "::error::The scanned local candidate ${SCAN_REF} is not loaded"
            exit 1
          }

      - name: Pull immutable scanned candidate
        if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
        shell: bash
        env:
          SCAN_REF: ${{ needs.docker-build.outputs.scan_ref }}
        run: |
          set -euo pipefail
          [[ "${SCAN_REF}" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::SCAN_REF must be an immutable ghcr.io digest"
            exit 1
          }
          docker pull "${SCAN_REF}"
          docker image inspect "${SCAN_REF}" >/dev/null

      - name: Run E2E Tests
        uses: pauszek/fsamp-code-ci/.github/actions/run-e2e@cad15e48d90cdb74ef335437c4c00434729bf8af
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          this-image: ${{ needs.docker-build.outputs.scan_ref }}
          app-token: ${{ steps.app-token.outputs.token }}
          localstack-token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
