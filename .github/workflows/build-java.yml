name: Build for Java Project
on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Load params
    runs-on: ubuntu-latest
    outputs:
      ci_java_version: ${{ steps.out.outputs.ci_java_version }}
      ci_distribution: ${{ steps.out.outputs.ci_distribution }}
      files_version: ${{ steps.out.outputs.files_version }}
      qodana_enabled: ${{ steps.out.outputs.qodana_enabled }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      release_publish: ${{ steps.out.outputs.release_publish }}
      action_repo: ${{ steps.action-meta.outputs.repo }}
      action_ref: ${{ steps.action-meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 'Get action metadata'
        id: action-meta
        shell: bash
        run: |
          path_parts=(${GITHUB_ACTION_PATH//\// })
          count=${#path_parts[@]}
          ref=${path_parts[count-2]}
          repo="${path_parts[count-4]}/${path_parts[count-3]}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Install PyYAML
        run: pip3 install --disable-pip-version-check --no-input pyyaml
      - name: Parse .github/params.yml
        id: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, yaml
          path = ".github/params.yml"
          data = {}
          try:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              data = {}
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          qod = data.get("qodana", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          def w(k,v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o: o.write(f"{k}={v}\n")
          w("ci_java_version", ci.get("java-version","21"))
          w("ci_distribution", ci.get("distribution","temurin"))
          w("files_version", files.get("version","release.version"))
          w("qodana_enabled", str(qod.get("enabled", False)).lower())
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch","main"))
          w("bump_label", bump.get("label","autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("release_publish", str(rel.get("publish", False)).lower())
          PY

  build:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Maven Build
        uses: ${{ needs.params.outputs.action_repo }}/.github/actions/maven-build@${{ needs.params.outputs.action_ref }}
        with:
          java-version: ${{ needs.params.outputs.ci_java_version }}
          distribution: ${{ needs.params.outputs.ci_distribution }}
          revision-file: ${{ needs.params.outputs.files_version }}

  qodana:
    needs: [ params, build ]
    if: needs.params.outputs.qodana_enabled == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Qodana
        uses: ${{ needs.params.outputs.action_repo }}/.github/actions/qodana-scan@${{ needs.params.outputs.action_ref }}
        with:
          qodana-token: ${{ secrets.QODANA_TOKEN }}
          post-pr-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  tag_and_release:
    needs: [ params, build ]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      full_release: ${{ steps.cfg.outputs.full_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure release outputs
        id: cfg
        shell: bash
        env:
          FULL: ${{ needs.params.outputs.release_full_release }}
        run: |
          set -euo pipefail
          echo "full_release=${FULL:-false}" >> "$GITHUB_OUTPUT"

      - name: Tag and (pre)-release
        uses: ${{ needs.params.outputs.action_repo }}/.github/actions/tag-and-release@${{ needs.params.outputs.action_ref }}
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ steps.cfg.outputs.full_release }}
          tag-prefix: v

  publish:
    needs: [ params, build, tag_and_release ]
    if: needs.params.outputs.release_publish == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch && needs.tag_and_release.outputs.full_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish package
        uses: ${{ needs.params.outputs.action_repo }}/.github/actions/publish@${{ needs.params.outputs.action_ref }}

  bump:
    needs: [ params, build, tag_and_release ]
    if: needs.params.outputs.bump_enabled == 'true' && github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch && needs.tag_and_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump release.version via PR
        uses: ${{ needs.params.outputs.action_repo }}/.github/actions/bump-release-version@${{ needs.params.outputs.action_ref }}
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}
