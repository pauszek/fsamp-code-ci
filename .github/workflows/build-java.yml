name: Build for Java Project

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: false
      GABRBA_SECRET:
        description: GitHub App private key for cross-repo access
        required: false
      LOCALSTACK_AUTH_TOKEN:
        description: LocalStack Pro token for E2E tests
        required: false
      NVD_API_KEY:
        description: NIST NVD API key for OWASP Dependency-Check
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. PARAMS - Load Configuration
  # ---------------------------------------------------------------------------
  params:
    name: 📋 Load Configuration
    runs-on: ubuntu-latest
    outputs:
      ci_java_version: ${{ steps.out.outputs.ci_java_version }}
      ci_distribution: ${{ steps.out.outputs.ci_distribution }}
      files_version: ${{ steps.out.outputs.files_version }}
      bump_enabled: ${{ steps.out.outputs.bump_enabled }}
      bump_base_branch: ${{ steps.out.outputs.bump_base_branch }}
      bump_label: ${{ steps.out.outputs.bump_label }}
      release_full_release: ${{ steps.out.outputs.release_full_release }}
      docker_enabled: ${{ steps.out.outputs.docker_enabled }}
      docker_image_name: ${{ steps.out.outputs.docker_image_name }}
      docker_registry: ${{ steps.out.outputs.docker_registry }}
      docker_dockerfile: ${{ steps.out.outputs.docker_dockerfile }}
      sonar_enabled: ${{ steps.out.outputs.sonar_enabled }}
      sonar_organization: ${{ steps.out.outputs.sonar_organization }}
      sonar_project_key: ${{ steps.out.outputs.sonar_project_key }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --quiet --disable-pip-version-check pyyaml

      - name: Parse .github/params.yml
        id: out
        run: |
          python3 - <<'PY'
          import os, yaml
          
          data = {}
          try:
              with open(".github/params.yml") as f:
                  data = yaml.safe_load(f) or {}
          except FileNotFoundError:
              pass
          
          ci = data.get("ci", {}) or {}
          files = data.get("files", {}) or {}
          bump = data.get("bump", {}) or {}
          rel = data.get("release", {}) or {}
          docker = data.get("docker", {}) or {}
          sonar = data.get("sonar", {}) or {}
          
          def w(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write(f"{k}={v}\n")
          
          w("ci_java_version", ci.get("java-version", "21"))
          w("ci_distribution", ci.get("distribution", "temurin"))
          w("files_version", files.get("version", "release.version"))
          w("bump_enabled", str(bump.get("enabled", True)).lower())
          w("bump_base_branch", bump.get("base-branch", "main"))
          w("bump_label", bump.get("label", "autobump"))
          w("release_full_release", str(rel.get("full-release", False)).lower())
          w("docker_enabled", str(docker.get("enabled", False)).lower())
          w("docker_image_name", docker.get("image-name", ""))
          w("docker_registry", docker.get("registry", "ghcr.io"))
          w("docker_dockerfile", docker.get("dockerfile", "Dockerfile"))
          w("sonar_enabled", str(sonar.get("enabled", False)).lower())
          w("sonar_organization", sonar.get("organization", ""))
          w("sonar_project_key", sonar.get("project-key", ""))
          PY

      - name: Read version
        id: ver
        run: |
          file="${{ steps.out.outputs.files_version }}"
          [[ -s "$file" ]] && echo "version=$(tr -d ' \r\n' < "$file")" >> "$GITHUB_OUTPUT" || echo "version=0.0.0" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. BUILD - Compile, Test, Coverage
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Build & Test
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for schema.version
        id: schema
        run: |
          if [[ -f schema.version ]]; then
            echo "version=$(tr -d '[:space:]' < schema.version)" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.schema.outputs.exists == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-event-schema

      - name: Checkout event schema
        if: steps.schema.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          repository: pauszek/fsamp-event-schema
          path: schema-repo
          ref: v${{ steps.schema.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup schema directory
        if: steps.schema.outputs.exists == 'true'
        run: |
          mkdir -p schema
          cp schema-repo/event.schema.json schema/

      - name: Setup Java ${{ needs.params.outputs.ci_java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} test

      - name: Integration tests
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} failsafe:integration-test failsafe:verify
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: FIPS 140-3 crypto provider tests
        if: needs.params.outputs.ci_distribution == 'corretto'
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} test \
            -Dgroups=fips \
            -Dspring.profiles.active=fips-test \
            -Dorg.bouncycastle.fips.approved_only=true

      - name: Generate SBOM (CycloneDX)
        run: mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} package -DskipTests -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/classes/META-INF/sbom/application.cdx.json
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. SONAR - Code Quality Analysis
  # ---------------------------------------------------------------------------
  sonar:
    name: 📊 SonarCloud
    needs: [params, build]
    if: needs.params.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
        continue-on-error: true

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp -Drevision=${{ needs.params.outputs.version }} \
            verify -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ needs.params.outputs.sonar_organization }} \
            -Dsonar.projectKey=${{ needs.params.outputs.sonar_project_key }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # ---------------------------------------------------------------------------
  # 3a. DEPENDENCY CHECK - OWASP Vulnerability Scan
  # ---------------------------------------------------------------------------
  dependency-check:
    name: 🛡️ OWASP Dependency-Check
    needs: [params, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ needs.params.outputs.ci_distribution }}
          java-version: ${{ needs.params.outputs.ci_java_version }}
          cache: maven

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: OWASP Dependency-Check
        shell: bash
        run: |
          set -o pipefail

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_delay="${NVD_API_DELAY:-1000}"
          else
            nvd_delay="${NVD_API_DELAY:-12000}"
          fi

          run_dependency_check() {
            mvn -B -ntp \
              -Drevision=${{ needs.params.outputs.version }} \
              -DdataDirectory="${PWD}/.dependency-check-data" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              -DnvdApiDelay="${nvd_delay}" \
              -DnvdMaxRetryCount=20 \
              -DnvdValidForHours=24 \
              verify -DskipTests -Psecurity 2>&1 | tee dependency-check-maven.log
          }

          run_dependency_check
          status=$?

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if grep -Eiq 'Error updating the NVD Data|NVD Returned Status Code: 429|Unable to access the local database|NoDataException|database has been closed|odc\.mv\.db' dependency-check-maven.log; then
            echo "::warning::Dependency-Check data update failed; clearing cached data and retrying once."
            rm -rf .dependency-check-data
            run_dependency_check
            exit $?
          fi

          exit "$status"
        # Keep the NVD key scoped to OWASP Dependency-Check only.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. DOCKER BUILD - Build Container Image
  # ---------------------------------------------------------------------------
  docker-build:
    name: 🐳 Build Image
    needs: [params, build]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@main
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          push: 'false'

      - name: Save image artifact
        run: docker save ${{ needs.params.outputs.docker_image_name }}:scan | gzip > docker-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 5. SECURITY SCAN
  # ---------------------------------------------------------------------------
  security-scan:
    name: 🔒 Security Scan
    needs: [params, docker-build]
    if: needs.params.outputs.docker_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Run Trivy scan
        uses: pauszek/fsamp-code-ci/.github/actions/security-scan@main
        with:
          image-ref: ${{ needs.params.outputs.docker_image_name }}:scan
          severity: 'CRITICAL,HIGH'
          fail-on-vuln: 'true'
          upload-sarif: 'false'

  # ---------------------------------------------------------------------------
  # 6. DOCKER PUSH
  # ---------------------------------------------------------------------------
  docker-push:
    name: 📦 Push to Registry
    needs: [params, build, docker-build, security-scan, e2e-tests]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch &&
      needs.security-scan.result == 'success' &&
      needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build and push
        uses: pauszek/fsamp-code-ci/.github/actions/docker-build@main
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          dockerfile: ${{ needs.params.outputs.docker_dockerfile }}
          version: ${{ needs.params.outputs.version }}
          registry: ${{ needs.params.outputs.docker_registry }}
          push: 'true'

  # ---------------------------------------------------------------------------
  # 7. TAG & RELEASE
  # ---------------------------------------------------------------------------
  tag-release:
    name: 🏷️ Tag & Release
    needs: [params, build]
    if: github.event_name == 'push' && github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tag and release
        uses: pauszek/fsamp-code-ci/.github/actions/tag-and-release@main
        with:
          version-file: ${{ needs.params.outputs.files_version }}
          full_release: ${{ needs.params.outputs.release_full_release }}
          tag-prefix: v

  # ---------------------------------------------------------------------------
  # 8. BUMP VERSION
  # ---------------------------------------------------------------------------
  bump:
    name: 🔄 Bump Version
    needs: [params, build, tag-release]
    if: |
      needs.params.outputs.bump_enabled == 'true' && 
      github.event_name == 'push' && 
      github.ref_name == needs.params.outputs.bump_base_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version via PR
        uses: pauszek/fsamp-code-ci/.github/actions/bump-release-version@main
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          version-file: ${{ needs.params.outputs.files_version }}
          base-branch: ${{ needs.params.outputs.bump_base_branch }}
          label: ${{ needs.params.outputs.bump_label }}

  # ---------------------------------------------------------------------------
  # 9. E2E TESTS (Required LocalStack gate)
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: 🧪 E2E Tests
    needs: [params, docker-build, security-scan]
    if: |
      needs.params.outputs.docker_enabled == 'true' && 
      needs.security-scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra,fsamp-gateway,fsamp-processor

      - name: Checkout fsamp-infra
        uses: actions/checkout@v5
        with:
          repository: pauszek/fsamp-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Checkout this repo
        uses: actions/checkout@v5
        with:
          path: this-repo

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build this service image
        run: |
          cd this-repo
          ./mvnw clean package -DskipTests -q
          docker build -t ${{ needs.params.outputs.docker_image_name }}:e2e-this .

      - name: Run E2E Tests
        uses: pauszek/fsamp-code-ci/.github/actions/run-e2e@main
        with:
          image-name: ${{ needs.params.outputs.docker_image_name }}
          this-image: ${{ needs.params.outputs.docker_image_name }}:e2e-this
          app-token: ${{ steps.app-token.outputs.token }}
          localstack-token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
