name: Bump release.version and open PR
description: Bump release.version and create auto merge PR using GitHub App
inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  version-file:
    description: Version file path
    required: false
    default: 'release.version'
  base-branch:
    description: Base branch for PR
    required: false
    default: 'main'
  label:
    description: Label to apply to PR
    required: false
    default: 'autobump'
outputs:
  new:
    description: New version
    value: ${{ steps.bump.outputs.new }}
  pr:
    description: Created PR number
    value: ${{ steps.cpr.outputs['pull-request-number'] }}
runs:
  using: composite
  steps:
    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs['app-id'] }}
        private-key: ${{ inputs['private-key'] }}

    - name: Checkout triggering commit
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        token: ${{ steps.app-token.outputs.token }}

    - name: Bump release.version (patch with rollover)
      id: bump
      shell: bash
      run: |
        set -euo pipefail
        file="${{ inputs['version-file'] }}"
        [[ -f "$file" ]] || { echo "Error: '$file' not found."; exit 1; }
        current="$(tr -d ' \r\n' < "$file")"
        [[ -n "$current" ]] || { echo "Error: '$file' is empty."; exit 1; }
        base="${current%%-*}"
        suffix="${current#"$base"}"
        [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Error: Version '$base' must be major.minor.patch"; exit 1; }
        IFS='.' read -r major minor patch <<< "$base"
        patch=$((patch + 1))
        if (( patch >= 100 )); then patch=0; minor=$((minor + 1)); fi
        if (( minor >= 100 )); then minor=0; major=$((major + 1)); fi
        new=$(printf "%d.%d.%d%s" "$major" "$minor" "$patch" "$suffix")
        echo "$new" > "$file"
        echo "new=$new" >> "$GITHUB_OUTPUT"

    - name: Create PR
      id: cpr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        commit-message: "chore: bump release.version to ${{ steps.bump.outputs.new }}"
        title: "[skip ci] chore: bump release.version to ${{ steps.bump.outputs.new }}"
        body: "Automated bump from run ${{ github.run_id }}."
        branch: chore/autobump-${{ steps.bump.outputs.new }}
        base: ${{ inputs['base-branch'] }}
        labels: ${{ inputs.label }}
        delete-branch: true

    - name: Enable auto-merge (squash)
      if: steps.cpr.outputs.pull-request-number != ''
      uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
      with:
        token: ${{ steps.app-token.outputs.token }}
        pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
        merge-method: squash
