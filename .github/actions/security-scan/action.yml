# =============================================================================
# Security Scan Action
# =============================================================================
# Scans Docker images for vulnerabilities using Trivy.
# 
# Features:
#   - Vulnerability scanning (OS packages, language dependencies)
#   - Configurable severity threshold (CRITICAL, HIGH, MEDIUM, LOW)
#   - SARIF report generation for GitHub Security tab (optional)
#   - Fails pipeline on HIGH/CRITICAL vulnerabilities (configurable)
#
# Note: SARIF upload requires GitHub Advanced Security (GHAS) for private repos.
#       On public repos or with GHAS, results appear in Security tab.
# =============================================================================
name: Security Scan
description: Scan Docker image for vulnerabilities with Trivy

inputs:
  image-ref:
    description: 'Docker image to scan (local tag or registry reference)'
    required: true
  severity:
    description: 'Severity levels to scan for (comma-separated)'
    required: false
    default: 'CRITICAL,HIGH'
  fail-on-vuln:
    description: 'Fail the pipeline if vulnerabilities are found'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload SARIF report to GitHub Security (requires GHAS for private repos)'
    required: false
    default: 'false'

outputs:
  vulnerabilities-found:
    description: 'Whether vulnerabilities were found'
    value: ${{ steps.scan.outputs.vulnerabilities-found }}
  sarif-file:
    description: 'Path to SARIF report'
    value: 'trivy-results.sarif'

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Vulnerability Scan with Trivy (Table format for logs)
    # -------------------------------------------------------------------------
    - name: Run Trivy vulnerability scanner (table)
      id: scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ inputs.image-ref }}
        format: 'table'
        severity: ${{ inputs.severity }}
        exit-code: ${{ inputs.fail-on-vuln == 'true' && '1' || '0' }}
      env:
        TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

    # -------------------------------------------------------------------------
    # Generate SARIF report (for GitHub Security tab)
    # -------------------------------------------------------------------------
    - name: Generate SARIF report
      if: inputs.upload-sarif == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ inputs.image-ref }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: ${{ inputs.severity }}
        exit-code: '0'  # Don't fail again, already checked above
      env:
        TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

    # -------------------------------------------------------------------------
    # Upload Results to GitHub Security Tab
    # -------------------------------------------------------------------------
    - name: Upload Trivy SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && inputs.upload-sarif == 'true'
      continue-on-error: true  # Silently fails on private repos without GHAS
      with:
        sarif_file: 'trivy-results.sarif'

    # -------------------------------------------------------------------------
    # Summary Report
    # -------------------------------------------------------------------------
    - name: Generate scan summary
      if: always()
      shell: bash
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ inputs.image-ref }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Severity filter:** ${{ inputs.severity }}" >> $GITHUB_STEP_SUMMARY
        echo "**Fail on vulnerabilities:** ${{ inputs.fail-on-vuln }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check exit status from previous scan step
        if [ "${{ steps.scan.outcome }}" == "failure" ]; then
          echo "⚠️ **Vulnerabilities found matching severity filter!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'Run Trivy vulnerability scanner' step output above for details." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **No vulnerabilities found matching ${{ inputs.severity }}**" >> $GITHUB_STEP_SUMMARY
        fi
