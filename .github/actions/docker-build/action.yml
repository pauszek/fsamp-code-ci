name: Docker Build
description: Build Docker image and optionally push to registry

inputs:
  image-name:
    description: 'Docker image name (without registry prefix)'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  version:
    description: 'Image version tag'
    required: true
  registry:
    description: 'Container registry (ghcr.io or ECR URL)'
    required: false
    default: 'ghcr.io'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  platforms:
    description: 'Target platforms'
    required: false
    default: 'linux/amd64'
  build-args:
    description: 'Docker build arguments'
    required: false
    default: ''

outputs:
  image:
    description: 'Full image reference (registry/name:tag)'
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  scan-tag:
    description: 'Local image tag for scanning'
    value: ${{ inputs.image-name }}:scan

runs:
  using: composite
  steps:
    - name: Set up QEMU (for multi-arch builds)
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GitHub Container Registry
      if: inputs.registry == 'ghcr.io' && inputs.push == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.version }}

    - name: Build Docker image (local)
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ inputs.image-name }}:scan
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push to registry
      id: build
      if: inputs.push == 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true

    - name: Install cosign
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

    - name: Install syft (SBOM generator)
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: 'v1.18.1'

    - name: Sign container image (keyless — Sigstore/Fulcio OIDC)
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        IMAGE_REF=$(echo "${TAGS}" | head -n1)
        echo "Signing image: ${IMAGE_REF}@${DIGEST}"
        cosign sign --yes "${IMAGE_REF}@${DIGEST}"

    # Attach CycloneDX SBOM evidence to the immutable image digest.
    - name: Generate CycloneDX SBOM with syft
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        IMAGE_REF=$(echo "${TAGS}" | head -n1)
        echo "Generating SBOM for ${IMAGE_REF}@${DIGEST}"
        syft "${IMAGE_REF}@${DIGEST}" -o cyclonedx-json > sbom.cdx.json
        echo "SBOM bytes: $(wc -c < sbom.cdx.json)"

    - name: Attest SBOM as in-toto predicate (keyless)
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        IMAGE_REF=$(echo "${TAGS}" | head -n1)
        echo "Attaching signed SBOM attestation to ${IMAGE_REF}@${DIGEST}"
        cosign attest --yes \
          --predicate sbom.cdx.json \
          --type cyclonedx \
          "${IMAGE_REF}@${DIGEST}"

    - name: Prepare SBOM artifact name
      id: sbom-artifact
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ inputs.version }}
      run: |
        safe_image=$(printf '%s' "${IMAGE_NAME}" | sed -E 's#[^A-Za-z0-9._-]+#-#g; s#^-+|-+$##g')
        safe_version=$(printf '%s' "${VERSION}" | sed -E 's#[^A-Za-z0-9._-]+#-#g; s#^-+|-+$##g')
        echo "name=sbom-${safe_image:-image}-${safe_version:-version}" >> "$GITHUB_OUTPUT"

    - name: Upload SBOM as workflow artifact
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.sbom-artifact.outputs.name }}
        path: sbom.cdx.json
        retention-days: 90
        if-no-files-found: warn

    - name: Verify attestation visibility
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        IMAGE_REF=$(echo "${TAGS}" | head -n1)
        echo "Verifying signature and CycloneDX attestation are queryable"
        for attempt in 1 2 3 4 5 6; do
          if cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE_REF}@${DIGEST}" > /dev/null &&
             cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.+" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE_REF}@${DIGEST}" > /dev/null; then
            exit 0
          fi

          sleep $((attempt * 10))
        done

        echo "::error::cosign signature or CycloneDX attestation was not visible after retries"
        exit 1
