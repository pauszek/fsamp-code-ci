# =============================================================================
# Docker Build and Push Action
# =============================================================================
# Builds Docker image with multi-platform support and pushes to ECR/GHCR.
# Includes security scanning with Trivy.
# =============================================================================
name: Docker Build and Push
description: Build, scan, and push Docker image to registry

inputs:
  image-name:
    description: 'Docker image name (without registry prefix)'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  version:
    description: 'Image version tag'
    required: true
  registry:
    description: 'Container registry (ghcr.io or ECR URL)'
    required: false
    default: 'ghcr.io'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  platforms:
    description: 'Target platforms for multi-arch build'
    required: false
    default: 'linux/amd64,linux/arm64'
  scan-severity:
    description: 'Trivy scan severity threshold'
    required: false
    default: 'CRITICAL,HIGH'
  scan-exit-code:
    description: 'Exit code on vulnerability found'
    required: false
    default: '1'
  build-args:
    description: 'Docker build arguments'
    required: false
    default: ''

outputs:
  image:
    description: 'Full image reference (registry/name:tag)'
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: inputs.registry == 'ghcr.io' && inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build Docker image (for scanning)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ inputs.image-name }}:scan
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ inputs.image-name }}:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: ${{ inputs.scan-severity }}
        exit-code: ${{ inputs.scan-exit-code }}

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Build and push
      id: build
      if: inputs.push == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true
