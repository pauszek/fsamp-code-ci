# =============================================================================
# Docker Build Action
# =============================================================================
# Builds Docker image with multi-platform support.
# Security scanning is handled by a separate job for better separation of concerns.
#
# Features:
#   - Multi-platform builds (amd64, arm64)
#   - GitHub Container Registry (GHCR) support
#   - Build caching via GitHub Actions cache
#   - SBOM and provenance attestation
# =============================================================================
name: Docker Build
description: Build Docker image and optionally push to registry

inputs:
  image-name:
    description: 'Docker image name (without registry prefix)'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  version:
    description: 'Image version tag'
    required: true
  registry:
    description: 'Container registry (ghcr.io or ECR URL)'
    required: false
    default: 'ghcr.io'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  platforms:
    description: 'Target platforms for multi-arch build'
    required: false
    default: 'linux/amd64,linux/arm64'
  build-args:
    description: 'Docker build arguments'
    required: false
    default: ''

outputs:
  image:
    description: 'Full image reference (registry/name:tag)'
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  scan-tag:
    description: 'Local image tag for scanning'
    value: ${{ inputs.image-name }}:scan

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Setup Docker Build Environment
    # -------------------------------------------------------------------------
    - name: Set up QEMU (for multi-arch builds)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # -------------------------------------------------------------------------
    # Registry Authentication
    # -------------------------------------------------------------------------
    - name: Log in to GitHub Container Registry
      if: inputs.registry == 'ghcr.io' && inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # -------------------------------------------------------------------------
    # Image Metadata
    # -------------------------------------------------------------------------
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.version }}

    # -------------------------------------------------------------------------
    # Build Image (local - for scanning)
    # -------------------------------------------------------------------------
    - name: Build Docker image (local)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ inputs.image-name }}:scan
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # -------------------------------------------------------------------------
    # Build & Push to Registry
    # -------------------------------------------------------------------------
    - name: Build and push to registry
      id: build
      if: inputs.push == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true
