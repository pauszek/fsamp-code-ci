name: Run E2E Tests
description: Run E2E integration tests with LocalStack (builds counterpart locally)

inputs:
  image-name:
    description: Docker image name (e.g., fsamp-gateway)
    required: true
  this-image:
    description: Full image reference for the service being tested
    required: true
  app-token:
    description: GitHub App token for repo access
    required: true
  localstack-token:
    description: LocalStack Pro auth token
    required: true
  infra-path:
    description: Path to fsamp-infra checkout
    required: false
    default: infra

runs:
  using: composite
  steps:
    - name: Select fsamp-infra ref
      shell: bash
      env:
        INFRA_PATH: ${{ inputs.infra-path }}
      run: |
        set -euo pipefail
        if [[ ! -d "${INFRA_PATH}/.git" ]]; then
          echo "fsamp-infra checkout not found at ${INFRA_PATH}; later steps will fail with a clearer error."
          exit 0
        fi

        branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        if [[ -n "${branch}" ]] &&
           git -C "${INFRA_PATH}" ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
          git -C "${INFRA_PATH}" fetch --depth=1 origin "${branch}"
          git -C "${INFRA_PATH}" checkout --detach FETCH_HEAD
        fi

        echo "Using fsamp-infra ref:"
        git -C "${INFRA_PATH}" --no-pager log -1 --oneline

    - name: Determine counterpart
      id: counterpart
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        THIS_IMAGE: ${{ inputs.this-image }}
      run: |
        set -euo pipefail
        OWNER="${GITHUB_REPOSITORY_OWNER}"
        
        echo "E2E test configuration"

        if [[ "$IMAGE_NAME" == *"gateway"* ]]; then
          echo "Testing: Gateway"
          echo "This build: ${THIS_IMAGE}"
          echo "Will build: Processor from source"
          echo "service=gateway" >> "$GITHUB_OUTPUT"
          echo "counterpart_repo=${OWNER}/fsamp-processor" >> "$GITHUB_OUTPUT"
          echo "counterpart_name=fsamp-processor" >> "$GITHUB_OUTPUT"
          echo "gateway_image=${THIS_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "processor_image=fsamp-processor:e2e" >> "$GITHUB_OUTPUT"
        elif [[ "$IMAGE_NAME" == *"processor"* ]]; then
          echo "Testing: Processor"
          echo "This build: ${THIS_IMAGE}"
          echo "Will build: Gateway from source"
          echo "service=processor" >> "$GITHUB_OUTPUT"
          echo "counterpart_repo=${OWNER}/fsamp-gateway" >> "$GITHUB_OUTPUT"
          echo "counterpart_name=fsamp-gateway" >> "$GITHUB_OUTPUT"
          echo "gateway_image=fsamp-gateway:e2e" >> "$GITHUB_OUTPUT"
          echo "processor_image=${THIS_IMAGE}" >> "$GITHUB_OUTPUT"
        else
          echo "Unknown service: $IMAGE_NAME"
          exit 1
        fi

    - name: Determine counterpart ref
      id: counterpart-ref
      shell: bash
      env:
        APP_TOKEN: ${{ inputs.app-token }}
        COUNTERPART_REPO: ${{ steps.counterpart.outputs.counterpart_repo }}
      run: |
        set -euo pipefail
        branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        ref="main"

        if [[ -n "${branch}" ]]; then
          repo_url="https://x-access-token:${APP_TOKEN}@github.com/${COUNTERPART_REPO}.git"
          if git ls-remote --exit-code --heads "${repo_url}" "${branch}" >/dev/null 2>&1; then
            ref="${branch}"
          fi
        fi

        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
        echo "Counterpart ref: ${ref}"

    - name: Checkout counterpart repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ steps.counterpart.outputs.counterpart_repo }}
        ref: ${{ steps.counterpart-ref.outputs.ref }}
        token: ${{ inputs.app-token }}
        path: counterpart

    - name: Set up JDK 21 (for Gateway)
      if: steps.counterpart.outputs.counterpart_name == 'fsamp-gateway'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build counterpart image
      shell: bash
      env:
        COUNTERPART_NAME: ${{ steps.counterpart.outputs.counterpart_name }}
      run: |
        echo "Building counterpart: ${COUNTERPART_NAME}"
        
        cd counterpart
        
        if [[ "$COUNTERPART_NAME" == "fsamp-gateway" ]]; then
          ./mvnw clean package -DskipTests -q
          docker build -t fsamp-gateway:e2e .
        elif [[ "$COUNTERPART_NAME" == "fsamp-processor" ]]; then
          docker build -f Dockerfile.lambda -t fsamp-processor:e2e .
        fi
        
        echo "Counterpart built: ${COUNTERPART_NAME}:e2e"

    - name: Verify processor FIPS runtime
      shell: bash
      env:
        PROCESSOR_IMAGE: ${{ steps.counterpart.outputs.processor_image }}
      run: |
        set -euo pipefail
        docker run --rm --entrypoint python "${PROCESSOR_IMAGE}" \
          -c 'from processor.infrastructure.fips import enforce_fips; enforce_fips(True)'

    - name: Start LocalStack
      shell: bash
      working-directory: ${{ inputs.infra-path }}/e2e
      env:
        LOCALSTACK_AUTH_TOKEN: ${{ inputs.localstack-token }}
      run: |
        if [[ -z "${LOCALSTACK_AUTH_TOKEN:-}" ]]; then
          echo "::error::LOCALSTACK_AUTH_TOKEN is empty. Add it as a repository secret and pass it to the reusable workflow."
          exit 1
        fi

        echo "LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}" >> "$GITHUB_ENV"
        docker compose up -d localstack
        echo "Waiting for LocalStack..."
        timeout 180 bash -c 'until docker exec fsamp-e2e-localstack test -f /tmp/localstack-config/fsamp-config.env 2>/dev/null; do sleep 5; done'
        echo "LocalStack ready"

        metadata_keys="$(docker exec fsamp-e2e-localstack awslocal dynamodb describe-table \
          --table-name fsamp-local-file-metadata \
          --query 'Table.KeySchema[].AttributeName' \
          --output text)"
        echo "fsamp-local-file-metadata key schema: ${metadata_keys}"
        if [[ "${metadata_keys}" != *"PK"* || "${metadata_keys}" != *"SK"* ]]; then
          echo "::error::fsamp-local-file-metadata must use PK/SK keys for current gateway builds."
          exit 1
        fi

        outbox_keys="$(docker exec fsamp-e2e-localstack awslocal dynamodb describe-table \
          --table-name fsamp-local-outbox \
          --query 'Table.KeySchema[].AttributeName' \
          --output text)"
        echo "fsamp-local-outbox key schema: ${outbox_keys}"
        if [[ "${outbox_keys}" != *"PK"* || "${outbox_keys}" != *"SK"* ]]; then
          echo "::error::fsamp-local-outbox must use PK/SK keys for current gateway builds."
          exit 1
        fi

    - name: Start application containers
      shell: bash
      working-directory: ${{ inputs.infra-path }}/e2e
      env:
        GATEWAY_IMAGE: ${{ steps.counterpart.outputs.gateway_image }}
        PROCESSOR_IMAGE: ${{ steps.counterpart.outputs.processor_image }}
      run: |
        echo "Starting containers:"
        echo "  Gateway:   ${GATEWAY_IMAGE}"
        echo "  Processor: ${PROCESSOR_IMAGE}"
        
        docker compose up -d gateway processor
        
        echo "Waiting for Gateway health..."
        timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
        echo "Gateway healthy"
        
        sleep 10
        echo "Processor started"

    - name: Run E2E tests
      shell: bash
      working-directory: ${{ inputs.infra-path }}/e2e
      env:
        GATEWAY_IMAGE: ${{ steps.counterpart.outputs.gateway_image }}
        PROCESSOR_IMAGE: ${{ steps.counterpart.outputs.processor_image }}
      run: |
        docker compose --profile test up --exit-code-from e2e-tests e2e-tests

    - name: Collect logs on failure
      if: failure()
      shell: bash
      working-directory: ${{ inputs.infra-path }}/e2e
      run: |
        echo "E2E failure container logs"
        if docker ps -a --format '{{.Names}}' | grep -qx "fsamp-e2e-localstack"; then
          echo "=== dynamodb schemas ==="
          for table in fsamp-local-file-metadata fsamp-local-outbox fsamp-local-idempotency-keys; do
            echo "--- ${table} ---"
            docker exec fsamp-e2e-localstack awslocal dynamodb describe-table \
              --table-name "${table}" \
              --query 'Table.{KeySchema:KeySchema,GlobalSecondaryIndexes:GlobalSecondaryIndexes[].KeySchema}' \
              --output json 2>/dev/null || true
          done
          echo ""
        fi

        for container in localstack gateway processor; do
          echo "=== ${container} ==="
          if docker ps -a --format '{{.Names}}' | grep -qx "fsamp-e2e-${container}"; then
            docker logs "fsamp-e2e-${container}" 2>&1 | tail -300 || true
          else
            echo "Container fsamp-e2e-${container} was not created."
          fi
          echo ""
        done

    - name: Cleanup
      if: always()
      shell: bash
      working-directory: ${{ inputs.infra-path }}/e2e
      env:
        LOCALSTACK_AUTH_TOKEN: ${{ inputs.localstack-token }}
      run: docker compose down -v --remove-orphans || true

outputs:
  gateway_image:
    description: Gateway image used in tests
    value: ${{ steps.counterpart.outputs.gateway_image }}
  processor_image:
    description: Processor image used in tests
    value: ${{ steps.counterpart.outputs.processor_image }}
